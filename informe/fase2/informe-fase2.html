<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual de Procesos — Fase 2 | Proyecto Rower</title>
<script>(function(){try{if(localStorage.getItem('rower.tema')==='oscuro')document.documentElement.setAttribute('data-tema','oscuro');}catch(e){}})();</script>
<!-- Acceso: guardia de sesión (redirige a /acceso/ si no hay sesión). No mover: corre antes de pintar. -->
<script src="../../supabase/sesion.js" data-proteger data-permiso="ver.informe"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../estilo/app.css">
<style>
  /* ── El módulo «Fase 2 — Procesos». Armazón navegable; el contenido de las
     secciones se llena con el pipeline de manuales. Identidad compartida
     (estilo/app.css); nada de colores propios salvo los estados de avance. ── */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--fuente);color:var(--tinta);background:var(--fondo);font-size:14px;line-height:1.5}
  a{color:inherit}

  [hidden]{display:none!important}
  .f2{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* ── barra superior ── */
  .f2-top{
    flex:none;display:flex;align-items:center;gap:14px;
    padding:0 18px;height:56px;border-bottom:1px solid var(--borde);
    background:var(--panel-vidrio);backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);z-index:20;
  }
  .f2-top .marca{display:flex;align-items:center;gap:10px;min-width:0}
  .f2-top .marca .nom{font-size:15px;font-weight:700;letter-spacing:-.02em;text-transform:lowercase;line-height:1.05}
  .f2-top .marca .sub{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--tinta-tenue)}
  .f2-top .crece{flex:1;min-width:0}
  .f2-top .lnk{font-size:12px;font-weight:600;color:var(--tinta-media);text-decoration:none;padding:6px 10px;border-radius:var(--r-pildora)}
  .f2-top .lnk:hover{background:var(--realce);color:var(--tinta)}
  .f2-icbtn{
    flex:none;width:34px;height:34px;border-radius:var(--r-pildora);border:1px solid var(--borde);
    background:var(--panel-alto);color:var(--tinta-media);font-size:15px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .f2-icbtn:hover{border-color:var(--tinta-tenue);color:var(--tinta)}
  .f2-abremenu{display:none}

  .f2-body{flex:1;display:flex;min-height:0}

  /* ── sidenav ── */
  .f2-nav{
    flex:none;width:314px;border-right:1px solid var(--borde);background:var(--lienzo);
    overflow-y:auto;padding:14px 10px 40px;
  }
  .f2-buscar{
    width:100%;font-family:inherit;font-size:12.5px;padding:8px 12px;margin-bottom:8px;
    background:var(--panel-alto);color:var(--tinta);border:1px solid var(--borde);border-radius:var(--r-pildora);
  }
  .f2-buscar::placeholder{color:var(--tinta-tenue)}
  .f2-buscar:focus{outline:none;border-color:var(--cian)}
  .f2-navhome{
    display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:6px;border-radius:10px;
    font-size:12.5px;font-weight:600;color:var(--tinta-media);text-decoration:none;
  }
  .f2-navhome:hover{background:var(--realce);color:var(--tinta)}
  .f2-navhome.on{background:var(--panel);color:var(--tinta);box-shadow:var(--sombra)}

  .f2-cat-tit{
    font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
    color:var(--tinta-tenue);padding:14px 12px 6px;
  }
  .f2-mrow{display:flex;align-items:stretch;gap:2px;border-radius:9px}
  .f2-mrow.on{background:var(--panel);box-shadow:var(--sombra)}
  .f2-mlink{
    flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;
    padding:8px 10px;font-size:12.5px;color:var(--tinta-media);text-decoration:none;line-height:1.3;
  }
  .f2-mrow.on .f2-mlink{color:var(--tinta);font-weight:650}
  .f2-mlink:hover{color:var(--tinta)}
  .f2-mpref{
    flex:none;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tinta-tenue);
    min-width:16px;text-align:right;
  }
  .f2-mchev{
    flex:none;width:26px;border:0;background:transparent;color:var(--tinta-tenue);cursor:pointer;
    display:flex;align-items:center;justify-content:center;border-radius:8px;
  }
  .f2-mchev:hover{background:var(--realce);color:var(--tinta)}
  .f2-mchev svg{width:12px;height:12px;transition:transform var(--rapido) var(--curva)}
  .f2-mchev[aria-expanded="true"] svg{transform:rotate(90deg)}
  .f2-msub{margin:0 0 4px 18px;padding-left:8px;border-left:1px solid var(--borde)}
  .f2-msub a{
    display:flex;align-items:baseline;gap:7px;padding:6px 9px;border-radius:8px;
    font-size:11.5px;color:var(--tinta-media);text-decoration:none;line-height:1.3;
  }
  .f2-msub a:hover{background:var(--realce);color:var(--tinta)}
  .f2-msub a.on{background:var(--gradiente-suave);color:var(--tinta);font-weight:600}
  .f2-pcod{flex:none;font-size:9.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tinta-tenue)}
  .f2-nada{padding:14px 12px;font-size:12px;color:var(--tinta-tenue)}

  /* ── zona de contenido ── */
  .f2-main{flex:1;min-width:0;overflow-y:auto;scroll-behavior:smooth}
  .f2-doc{max-width:1060px;margin:0 auto;padding:28px 40px 8px}

  .f2-migas{font-size:11.5px;color:var(--tinta-tenue);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .f2-migas a{color:var(--tinta-media);text-decoration:none}
  .f2-migas a:hover{color:var(--tinta)}
  .f2-migas .sep{opacity:.5}

  .f2-kicker{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cian);margin-bottom:6px}
  .f2-h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0 0 10px;text-transform:lowercase}
  .f2-h1::first-letter{text-transform:uppercase}
  .f2-lead{font-size:14px;color:var(--tinta-media);max-width:70ch;margin:0 0 16px}

  .f2-cab{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .f2-cab .f2-num{
    flex:none;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tinta-tenue);
    line-height:1.2;
  }
  .f2-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px}

  /* ── riel de secciones (scroll-spy) ── */
  .f2-riel{
    position:sticky;top:0;z-index:10;display:flex;gap:4px;flex-wrap:wrap;
    padding:10px 0;margin-bottom:6px;background:var(--fondo);border-bottom:1px solid var(--borde-tenue);
  }
  .f2-riel a{
    font-size:11.5px;font-weight:600;color:var(--tinta-media);text-decoration:none;
    padding:5px 11px;border-radius:var(--r-pildora);border:1px solid transparent;white-space:nowrap;
  }
  .f2-riel a:hover{background:var(--realce);color:var(--tinta)}
  .f2-riel a.on{background:var(--gradiente-suave);border-color:var(--menta);color:var(--tinta)}

  .f2-sec{padding:22px 0;border-bottom:1px solid var(--borde-tenue);scroll-margin-top:58px}
  .f2-sec:last-of-type{border-bottom:0}
  .f2-sec h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .f2-sec .f2-secnum{font-size:12px;font-weight:700;color:var(--tinta-tenue);font-variant-numeric:tabular-nums}
  .f2-sec .f2-secnota{font-size:12px;color:var(--tinta-media);margin:2px 0 12px}

  .f2-outline{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px}
  .f2-outline li{
    font-size:12.5px;color:var(--tinta-media);padding:7px 12px;border-left:2px solid var(--borde);
    background:var(--panel-alto);border-radius:0 8px 8px 0;
  }

  .f2-ficha{border:1px solid var(--borde);border-radius:var(--r-tarjeta);overflow:hidden;margin-top:10px}
  .f2-ficha .fr{display:flex;gap:0;border-top:1px solid var(--borde-tenue)}
  .f2-ficha .fr:first-child{border-top:0}
  .f2-ficha .fk{
    flex:none;width:150px;padding:10px 14px;font-size:10.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--tinta-tenue);background:var(--panel-alto);
  }
  .f2-ficha .fv{flex:1;min-width:0;padding:10px 14px;font-size:13px}
  .f2-ficha .fv ul{margin:0;padding-left:18px}
  .f2-ficha .fv li{margin:2px 0}

  .f2-proc{
    display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--borde);
    border-radius:12px;margin-top:8px;text-decoration:none;color:inherit;
    transition:border-color var(--rapido) var(--curva),transform var(--rapido) var(--curva);
  }
  .f2-proc:hover{border-color:var(--tinta-tenue);transform:translateX(2px)}
  .f2-proc .pc{flex:none;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tinta-tenue);min-width:30px}
  .f2-proc .pn{flex:1;min-width:0;font-size:13px;font-weight:600}
  .f2-proc .pa{flex:none;font-size:14px;color:var(--tinta-tenue)}

  /* ── contenido real: prosa, listas numeradas, tablas ── */
  .f2-prosa{font-size:13px;line-height:1.65;color:var(--tinta);margin:6px 0 14px;white-space:pre-line}
  .f2-nota{
    margin:8px 0 14px;padding:10px 14px;border-radius:var(--r-tarjeta);font-size:12px;line-height:1.55;
    background:rgba(255,201,74,.08);border:1px solid rgba(255,201,74,.3);color:var(--tinta-media);
  }
  .f2-num-list{margin:6px 0 16px;padding-left:22px;display:flex;flex-direction:column;gap:9px}
  .f2-num-list li{font-size:13px;line-height:1.55;color:var(--tinta)}
  .f2-num-list b{color:var(--tinta);font-weight:650}
  .f2-tabla-wrap{margin:6px 0 16px;border:1px solid var(--borde);border-radius:var(--r-tarjeta);overflow:auto}
  table.f2-tabla{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
  table.f2-tabla thead th{
    position:sticky;top:0;background:var(--panel-alto);padding:9px 11px;text-align:left;
    font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-tenue);
    border-bottom:1px solid var(--borde);white-space:nowrap;
  }
  table.f2-tabla tbody td{padding:9px 11px;border-bottom:1px solid var(--borde-tenue);vertical-align:top;color:var(--tinta)}
  table.f2-tabla tbody tr:last-child td{border-bottom:0}
  table.f2-tabla tbody tr:hover{background:var(--realce)}
  .f2-subtit{font-size:12px;font-weight:700;color:var(--tinta-media);margin:16px 0 4px;text-transform:uppercase;letter-spacing:.06em}
  .f2-subtit:first-child{margin-top:2px}

  /* ── flujograma embebido ── */
  .fx-marco{position:relative;margin:6px 0 16px;border:1px solid var(--borde);border-radius:var(--r-tarjeta);background:var(--panel);overflow:hidden}
  .fx-scroll{overflow:auto;padding:10px}
  .fx-ampliar{
    position:absolute;right:10px;top:10px;font-size:11.5px;font-weight:600;color:var(--tinta-media);
    background:var(--panel-vidrio);border:1px solid var(--borde);border-radius:var(--r-pildora);padding:5px 11px;cursor:pointer;
    backdrop-filter:blur(8px);
  }
  .fx-ampliar:hover{border-color:var(--tinta-tenue);color:var(--tinta)}
  .fx-svg{display:block}
  .fx-lane{fill:var(--panel-alto);stroke:var(--borde-tenue);stroke-width:1}
  .fx-lane:nth-child(odd){fill:var(--panel)}
  .fx-lane-cab{fill:var(--panel);stroke:var(--borde-tenue);stroke-width:1}
  .fx-lane-t{font:700 11px var(--fuente);fill:var(--tinta-media)}
  .fx-nodo{fill:var(--panel);stroke:var(--tinta-tenue);stroke-width:1.5}
  .fx-inicio,.fx-fin{fill:var(--menta);stroke:var(--menta)}
  .fx-decision{fill:var(--panel-alto);stroke:var(--alerta);stroke-width:1.5}
  .fx-nodo-t{font:650 11px var(--fuente);fill:var(--tinta)}
  .fx-evt-t{font:600 10px var(--fuente);fill:var(--tinta-media)}
  .fx-sis{font:600 9.5px var(--mono);fill:var(--cian)}
  .fx-arista{fill:none;stroke:var(--tinta-tenue);stroke-width:1.6}
  .fx-etq{font:700 10.5px var(--fuente);fill:var(--alerta)}

  .fx-lb{position:fixed;inset:0;z-index:200;background:var(--fondo);display:flex;flex-direction:column}
  .fx-lb-bar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--borde);font-size:13px}
  .fx-lb-bar button{border:0;background:var(--panel-alto);color:var(--tinta-media);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
  .fx-lb-vp{flex:1;overflow:hidden;position:relative;cursor:grab}
  .fx-lb-world{position:absolute;left:0;top:0;transform-origin:0 0}

  .f2-vacio{
    margin-top:10px;padding:18px 16px;border:1px dashed var(--borde);border-radius:var(--r-tarjeta);
    font-size:12.5px;color:var(--tinta-tenue);line-height:1.5;
  }

  /* ── mapa de la portada ── */
  .f2-bandas{display:flex;flex-direction:column;gap:14px;margin-top:8px}
  .f2-banda{border:1px solid var(--borde);border-radius:var(--r-panel);padding:14px 16px;background:var(--panel)}
  .f2-banda .bt{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .f2-banda .bt b{font-size:13px;font-weight:700;text-transform:lowercase}
  .f2-banda .bt span{font-size:11px;color:var(--tinta-tenue)}
  .f2-banda .bg{font-size:12px;color:var(--tinta-media);margin-bottom:12px}
  .f2-mcards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .f2-mcard{
    display:block;text-decoration:none;color:inherit;padding:12px 13px;border:1px solid var(--borde);
    border-radius:14px;background:var(--panel-alto);
    transition:border-color var(--rapido) var(--curva),transform var(--rapido) var(--curva),box-shadow var(--rapido) var(--curva);
  }
  .f2-mcard:hover{border-color:var(--menta);transform:translateY(-2px);box-shadow:var(--sombra)}
  .f2-mcard .mp{font-size:10px;font-weight:700;color:var(--tinta-tenue);font-variant-numeric:tabular-nums}
  .f2-mcard .mn{font-size:13px;font-weight:650;line-height:1.25;margin:3px 0 8px}
  .f2-mcard .mc{font-size:11px;color:var(--tinta-tenue)}

  .f2-aside{border:1px solid var(--borde);border-radius:var(--r-panel);padding:14px 16px;background:var(--panel);margin-top:16px}
  .f2-aside h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--tinta-tenue);margin:0 0 10px}
  .f2-aside .ax{padding:8px 0;border-top:1px solid var(--borde-tenue);font-size:12px}
  .f2-aside .ax:first-of-type{border-top:0}
  .f2-aside .ax b{font-weight:650}
  .f2-aside .ax span{display:block;color:var(--tinta-media);margin-top:2px}

  /* ── totalizaciones: [macro] [procesos → estrat/oper/soporte] ── */
  .f2-tot{display:flex;gap:14px;margin:16px 0;align-items:stretch;flex-wrap:wrap}
  .f2-tot .col-uno{flex:0 1 210px;display:flex}
  .f2-tot .col-uno .f2-kpi{flex:1;display:flex;flex-direction:column;justify-content:center}
  .f2-tot .col-dos{flex:1 1 260px;min-width:240px;display:flex;flex-direction:column;gap:0}
  .f2-kpi{border:1px solid var(--borde);border-radius:var(--r-tarjeta);padding:13px 15px;background:var(--panel)}
  .f2-kpi .kr{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--tinta-tenue)}
  .f2-kpi .kv{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:5px}
  .f2-kpi .kp{font-size:11px;color:var(--tinta-media);margin-top:4px}
  .f2-kpi.lg .kv{font-size:30px}
  /* el grupo derivado: espina vertical + tick a cada caja, como un corchete */
  .f2-deriv{display:flex;flex-direction:column;gap:7px;margin:10px 0 0 16px;padding-left:14px;border-left:2px solid var(--borde)}
  .f2-deriv .f2-kpi{position:relative;display:flex;align-items:baseline;gap:9px;padding:9px 13px;border-radius:12px}
  .f2-deriv .f2-kpi::before{content:'';position:absolute;left:-15px;top:50%;width:13px;height:2px;background:var(--borde)}
  .f2-deriv .f2-kpi .kr{margin:0;flex:1;min-width:0}
  .f2-deriv .f2-kpi .kv{font-size:17px;margin:0}
  .f2-deriv .f2-kpi .kp{margin:0;white-space:nowrap}
  .f2-kpi.cat-estrategico{background:color-mix(in srgb,var(--f2-estr) 10%,var(--panel));border-color:color-mix(in srgb,var(--f2-estr) 38%,var(--borde))}
  .f2-kpi.cat-operativo{background:color-mix(in srgb,var(--f2-oper) 10%,var(--panel));border-color:color-mix(in srgb,var(--f2-oper) 38%,var(--borde))}
  .f2-kpi.cat-soporte{background:color-mix(in srgb,var(--f2-sop) 10%,var(--panel));border-color:color-mix(in srgb,var(--f2-sop) 38%,var(--borde))}

  .f2-cober{margin:6px 0 2px}
  .f2-cober .cl{font-size:11.5px;color:var(--tinta-media);margin-bottom:5px}
  .f2-cober .barra{height:8px}

  details.f2-acerca{margin-top:22px;border:1px solid var(--borde);border-radius:var(--r-tarjeta);background:var(--panel)}
  details.f2-acerca summary{padding:12px 16px;font-size:12.5px;font-weight:650;cursor:pointer;list-style:none}
  details.f2-acerca summary::-webkit-details-marker{display:none}
  details.f2-acerca[open] summary{border-bottom:1px solid var(--borde-tenue)}
  details.f2-acerca .ac{padding:14px 16px;font-size:12px;color:var(--tinta-media);line-height:1.6}
  details.f2-acerca .ac ol{margin:6px 0 0;padding-left:20px}
  details.f2-acerca .ac li{margin:5px 0}

  /* ── navegación anterior/siguiente ── */
  .f2-pasos{display:flex;justify-content:space-between;gap:12px;margin:24px 0 10px}
  .f2-pasos a{
    flex:1;max-width:48%;text-decoration:none;color:inherit;padding:11px 14px;border:1px solid var(--borde);
    border-radius:12px;font-size:12px;
  }
  .f2-pasos a:hover{border-color:var(--tinta-tenue)}
  .f2-pasos a.sig{text-align:right}
  .f2-pasos a .pl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-tenue);display:block;margin-bottom:3px}
  .f2-pasos a .pt{font-weight:600}

  /* ── pie de confidencialidad ── */
  .f2-conf{
    max-width:1060px;margin:8px auto 0;padding:14px 40px 22px;
    font-size:10.5px;color:var(--tinta-tenue);border-top:1px solid var(--borde-tenue);line-height:1.5;
  }

  /* ── mapa interactivo (#/mapa) ── */
  :root{ --f2-estr:var(--cian); --f2-oper:var(--menta); --f2-sop:var(--alerta); }
  #mapa{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--fondo)}
  #mapa[hidden]{display:none}
  .mp-bar{
    flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;
    border-bottom:1px solid var(--borde);background:var(--panel-vidrio);
    backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);z-index:6;flex-wrap:wrap;
  }
  .mp-tit{font-size:13px;font-weight:700;letter-spacing:-.01em}
  .mp-sp{flex:1;min-width:8px}
  .mp-btn{
    font-family:inherit;font-size:12px;font-weight:600;color:var(--tinta-media);text-decoration:none;
    background:var(--panel-alto);border:1px solid var(--borde);border-radius:var(--r-pildora);padding:6px 12px;cursor:pointer;
  }
  .mp-btn:hover{border-color:var(--tinta-tenue);color:var(--tinta)}
  .mp-btn.on{background:var(--gradiente-suave);border-color:var(--menta);color:var(--tinta)}
  #mpBuscar{
    font-family:inherit;font-size:12px;background:var(--panel-alto);color:var(--tinta);
    border:1px solid var(--borde);border-radius:var(--r-pildora);padding:6px 12px;width:210px;
  }
  #mpBuscar:focus{outline:none;border-color:var(--cian)}

  .mp-vp{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none}
  .mp-vp.arrastrando{cursor:grabbing}
  .mp-world{position:absolute;left:0;top:0;transform-origin:0 0}
  .mp-world.anim{transition:transform .55s var(--curva)}
  .mp-canvas{position:relative}
  .mp-wires{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .mp-wires text{font-family:var(--mono);font-size:12px;fill:var(--tinta-media);paint-order:stroke;
    stroke:var(--fondo);stroke-width:4px}

  .mp-eyebrow{position:absolute;font-family:var(--mono);font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--tinta-tenue)}

  .mp-nodo{
    position:absolute;width:224px;background:var(--panel);border:1.5px solid var(--borde);
    border-radius:14px;box-shadow:var(--sombra);cursor:pointer;
    transition:box-shadow var(--rapido) var(--curva),opacity var(--medio) var(--curva),filter var(--medio) var(--curva);
  }
  .mp-nodo:hover{box-shadow:var(--sombra-alta)}
  .mp-nodo header{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--borde-tenue);border-radius:12px 12px 0 0}
  .mp-nodo .bx{width:26px;height:26px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:#04212B}
  .mp-nodo .tt{font-size:12.5px;font-weight:700;line-height:1.2}
  .mp-nodo .cnt{padding:6px 11px 9px;font-size:11px;color:var(--tinta-tenue)}
  .mp-nodo.estrategico header{background:color-mix(in srgb,var(--f2-estr) 13%,var(--panel))} .mp-nodo.estrategico .bx{background:var(--f2-estr)}
  .mp-nodo.operativo   header{background:color-mix(in srgb,var(--f2-oper) 13%,var(--panel))} .mp-nodo.operativo .bx{background:var(--f2-oper)}
  .mp-nodo.soporte     header{background:color-mix(in srgb,var(--f2-sop) 13%,var(--panel))}  .mp-nodo.soporte .bx{background:var(--f2-sop)}
  .mp-nodo.ext{width:186px;border-style:dashed;border-radius:999px;background:var(--panel-alto)}
  .mp-nodo.ext header{border:0;background:transparent;padding:9px 15px}
  .mp-nodo.ext .bx{background:var(--tinta-tenue);color:var(--panel)}
  .mp-nodo.ext .cnt{display:none}

  #mapa.enfoque .mp-nodo{opacity:.25;filter:saturate(.6)}
  #mapa.enfoque .mp-nodo.on{opacity:1;filter:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--menta) 50%,transparent),var(--sombra)}

  .mp-escenas{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;display:flex;gap:6px;
    padding:7px 8px;border-radius:var(--r-pildora);background:var(--panel-vidrio);border:1px solid var(--borde);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--sombra);
  }
  .mp-escenas button{font-family:inherit;font-size:11.5px;font-weight:600;color:var(--tinta-media);
    background:transparent;border:0;border-radius:var(--r-pildora);padding:5px 11px;cursor:pointer}
  .mp-escenas button:hover{color:var(--tinta);background:var(--realce)}
  .mp-escenas button.on{background:var(--gradiente-suave);color:var(--tinta)}

  .mp-zoom{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;flex-direction:column;gap:6px}
  .mp-zoom button{width:34px;height:32px;font-size:15px;font-family:inherit;color:var(--tinta-media);
    background:var(--panel);border:1px solid var(--borde);border-radius:9px;cursor:pointer}
  .mp-zoom button:hover{border-color:var(--tinta-tenue);color:var(--tinta)}

  .mp-drawer{
    position:absolute;top:58px;right:12px;bottom:64px;width:392px;max-width:calc(100% - 24px);z-index:7;
    background:var(--panel);border:1px solid var(--borde);border-radius:var(--r-panel);box-shadow:var(--sombra-alta);
    display:none;flex-direction:column;overflow:hidden;
  }
  .mp-drawer.abierto{display:flex}
  .mp-drawer header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--borde-tenue)}
  .mp-drawer .mp-dnum{width:28px;height:28px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;background:var(--panel-alto);color:var(--tinta-media)}
  .mp-drawer h3{flex:1;font-size:14px;font-weight:700;margin:0}
  .mp-drawer .mp-dx{border:0;background:transparent;color:var(--tinta-tenue);font-size:14px;cursor:pointer;padding:2px 6px}
  .mp-dbody{overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .mp-dbody .lst a{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:8px;
    font-size:12px;color:var(--tinta-media);text-decoration:none}
  .mp-dbody .lst a:hover{background:var(--realce);color:var(--tinta)}
  .mp-dbody .lst a .c{font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tinta-tenue);flex:none}

  .mp-leyenda{
    position:absolute;left:12px;bottom:64px;z-index:5;max-width:280px;
    background:var(--panel-vidrio);border:1px solid var(--borde);border-radius:12px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--sombra);
    padding:10px 13px;font-size:11px;display:flex;flex-direction:column;gap:6px;
  }
  .mp-leyenda b{font-size:12px}
  .mp-leyenda .li{display:flex;align-items:center;gap:8px;color:var(--tinta-media)}
  .mp-leyenda .sw{width:22px;height:12px;border-radius:3px;flex:none}
  .mp-leyenda .ln-tr{height:0;border-top:5px solid var(--f2-oper);border-radius:0}
  .mp-leyenda .ln-cr{height:0;border-top:2.5px dashed var(--tinta-tenue);border-radius:0}
  @media (max-width:820px){
    .mp-drawer{left:0;right:0;top:auto;bottom:0;width:100%;max-width:none;max-height:62%;border-radius:16px 16px 0 0}
    #mpBuscar{width:130px;flex:1}
    .mp-leyenda{display:none}
  }

  @media (max-width:900px){
    .f2-abremenu{display:inline-flex}
    .f2-nav{
      position:fixed;left:0;top:56px;bottom:0;width:300px;z-index:30;
      transform:translateX(-100%);transition:transform var(--medio) var(--curva);
    }
    body.f2-menu .f2-nav{transform:none;box-shadow:var(--sombra-alta)}
    .f2-doc{padding:20px 18px 8px}
    .f2-conf{padding:14px 18px 22px}
    .f2-riel{position:static}
  }
  @media print{
    .f2-top,.f2-nav,.f2-riel,.f2-pasos,#mapa{display:none!important}
    .f2{height:auto;overflow:visible}
    .f2-main{overflow:visible}
  }
</style>
</head>
<body>
<div class="f2">
  <header class="f2-top">
    <button class="f2-icbtn f2-abremenu" id="btnMenu" aria-label="Menú">☰</button>
    <div class="marca">
      <span class="orbe orbe-grande" aria-hidden="true"></span>
      <div>
        <div class="nom">manual de procesos</div>
        <div class="sub">UCAB Consultores · Grupo Kenex · Fase 2</div>
      </div>
    </div>
    <div class="crece"></div>
    <a class="lnk" href="#/mapa" id="lnkMapa">Mapa</a>
    <a class="lnk" href="../fase1/informe-diagnostico-fase1.html">← Fase 1</a>
    <button class="f2-icbtn" id="btnTema" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
  </header>

  <div class="f2-body">
    <nav class="f2-nav" id="nav"></nav>
    <div class="f2-main" id="main">
      <div class="f2-doc" id="doc"></div>
      <footer class="f2-conf" id="conf"></footer>
    </div>
  </div>

  <section id="mapa" hidden aria-label="Mapa de procesos">
    <div class="mp-bar">
      <a class="mp-btn" href="#/" id="mpVolver">‹ Índice</a>
      <div class="mp-tit">Mapa de procesos · cadena de valor</div>
      <div class="mp-sp"></div>
      <input id="mpBuscar" list="mpNombres" placeholder="Buscar macroproceso…" autocomplete="off">
      <datalist id="mpNombres"></datalist>
      <button class="mp-btn on" id="mpCruces" aria-pressed="true">Cruces</button>
    </div>
    <div class="mp-vp" id="mpVp"><div class="mp-world" id="mpWorld"><div class="mp-canvas" id="mpCanvas"><svg class="mp-wires" id="mpWires"></svg></div></div></div>
    <div class="mp-escenas" id="mpEscenas">
      <button data-esc="general" class="on">Vista general</button>
      <button data-esc="cadena">Cadena de valor</button>
      <button data-esc="estr">Estratégicos</button>
      <button data-esc="sop">Soporte</button>
    </div>
    <div class="mp-zoom">
      <button id="mpZin" aria-label="Acercar">+</button>
      <button id="mpZout" aria-label="Alejar">−</button>
      <button id="mpZfit" aria-label="Vista general">⤢</button>
    </div>
    <aside class="mp-drawer" id="mpDrawer" aria-label="Detalle del macroproceso">
      <header><span class="mp-dnum" id="mpDnum"></span><h3 id="mpDtit"></h3><button class="mp-dx" id="mpDx" aria-label="Cerrar">✕</button></header>
      <div class="mp-dbody" id="mpDbody"></div>
    </aside>
    <div class="mp-leyenda" id="mpLeyenda">
      <b>Leyenda</b>
      <div class="li"><i class="sw" style="background:var(--f2-estr)"></i>Estratégicos — orientan</div>
      <div class="li"><i class="sw" style="background:var(--f2-oper)"></i>Cadena de valor — producen y entregan</div>
      <div class="li"><i class="sw" style="background:var(--f2-sop)"></i>Soporte — sostienen</div>
      <div class="li"><i class="sw ln-tr"></i>Troncal de la cadena de valor</div>
      <div class="li"><i class="sw ln-cr"></i>Cruce entre macroprocesos <span class="tenue">(preliminar)</span></div>
    </div>
  </section>
</div>

<script src="manual-procesos-datos.js"></script>
<script src="manual-contenido.js"></script>
<script src="mapa-procesos-flujos.js"></script>
<script src="flujo-render.js"></script>
<script>
(function(){
  "use strict";
  var D = window.MANUAL_FASE2;
  var LS_NAV = 'rower.fase2.nav';
  var $ = function(s,c){return (c||document).querySelector(s);};
  var main = $('#main'), doc = $('#doc'), nav = $('#nav'), conf = $('#conf');

  // ---------- utilidades ----------
  function esc(t){var d=document.createElement('div');d.textContent=(t==null?'':String(t));return d.innerHTML;}
  function el(html){var t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
  function catNombre(id){for(var i=0;i<D.categorias.length;i++)if(D.categorias[i].id===id)return D.categorias[i].n;return id;}
  function macro(pref){return D.macros.filter(function(m){return m.prefijo===String(pref);})[0];}
  var CONT = window.MANUAL_CONTENIDO || {};
  function contN0(pref, secId){var c=CONT[String(pref)]; return c && c.n0 && c.n0[secId]; }
  function contN1(pref, cod, secId){var c=CONT[String(pref)]; var p=c && c.procesos && c.procesos[cod]; return p && p[secId]; }
  function hayContenido(c){ return c && c.estado && c.estado!=='pendiente'; }

  function tabla(cab, filas){
    if(!filas || !filas.length) return '';
    var h='<div class="f2-tabla-wrap"><table class="f2-tabla"><thead><tr>'+cab.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>';
    filas.forEach(function(f){
      h += '<tr>'+f.map(function(v){return '<td>'+(typeof v==='string' && v.indexOf('<')>=0 ? v : esc(v))+'</td>';}).join('')+'</tr>';
    });
    h += '</tbody></table></div>';
    return h;
  }
  function numLista(items){
    if(!items || !items.length) return '';
    return '<ol class="f2-num-list">'+items.map(function(it){
      if(it && typeof it==='object' && it.rol){
        return '<li><b>'+esc(it.rol)+'.</b> '+esc(it.texto)+'</li>';
      }
      return '<li>'+esc(it)+'</li>';
    }).join('')+'</ol>';
  }
  function subtit(t){ return '<div class="f2-subtit">'+esc(t)+'</div>'; }
  function prosa(t){ return t ? '<p class="f2-prosa">'+esc(t)+'</p>' : ''; }
  function procTodos(){var r=[];D.macros.forEach(function(m){m.procesos.forEach(function(p){r.push({m:m,p:p});});});return r;}
  function proc(cod){return procTodos().filter(function(x){return x.p.codigo===String(cod);})[0];}

  function leerAbiertos(){try{return JSON.parse(localStorage.getItem(LS_NAV))||{};}catch(e){return {};}}
  function guardarAbiertos(o){try{localStorage.setItem(LS_NAV,JSON.stringify(o));}catch(e){}}

  // ---------- sidenav ----------
  var CHEV='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 15.5 12 9 18.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function pintarNav(){
    var abiertos = leerAbiertos();
    var h = '<input class="f2-buscar" id="buscar" type="search" placeholder="Buscar macroproceso o proceso…" autocomplete="off">';
    h += '<a class="f2-navhome" href="#/">Inicio</a>';
    h += '<a class="f2-navhome" href="#/mapa" id="navMapa">Mapa de procesos</a>';
    D.categorias.forEach(function(cat){
      var ms = D.macros.filter(function(m){return m.cat===cat.id;});
      if(!ms.length) return;
      h += '<div class="f2-cat-tit">'+esc(cat.n)+'</div>';
      ms.forEach(function(m){
        var ab = abiertos[m.prefijo]===true;
        h += '<div class="f2-mrow" data-pref="'+esc(m.prefijo)+'">'+
               '<a class="f2-mlink" href="#/m/'+esc(m.prefijo)+'"><span class="f2-mpref">'+esc(m.prefijo)+'</span>'+esc(m.n)+'</a>'+
               '<button class="f2-mchev" data-toggle="'+esc(m.prefijo)+'" aria-expanded="'+ab+'" aria-label="Ver procesos de '+esc(m.n)+'">'+CHEV+'</button>'+
             '</div>';
        h += '<div class="f2-msub" id="sub-'+esc(m.prefijo)+'"'+(ab?'':' hidden')+'>';
        m.procesos.forEach(function(p){
          h += '<a href="#/p/'+esc(p.codigo)+'" data-cod="'+esc(p.codigo)+'"><span class="f2-pcod">'+esc(p.codigo)+'</span>'+esc(p.n)+'</a>';
        });
        h += '</div>';
      });
    });
    h += '<div class="f2-nada" id="navNada" hidden>Sin coincidencias.</div>';
    nav.innerHTML = h;

    nav.querySelectorAll('.f2-mchev').forEach(function(b){
      b.addEventListener('click', function(e){
        e.preventDefault();
        var pref=b.getAttribute('data-toggle'), sub=$('#sub-'+CSS.escape(pref));
        var abrir = b.getAttribute('aria-expanded')!=='true';
        b.setAttribute('aria-expanded', abrir);
        sub.hidden = !abrir;
        var o=leerAbiertos(); o[pref]=abrir; guardarAbiertos(o);
      });
    });
    $('#buscar').addEventListener('input', filtrarNav);
  }

  function filtrarNav(e){
    var q = (e.target.value||'').trim().toLowerCase();
    var algo = false;
    nav.querySelectorAll('.f2-cat-tit').forEach(function(t){t.style.display='';});
    D.macros.forEach(function(m){
      var row = nav.querySelector('.f2-mrow[data-pref="'+CSS.escape(m.prefijo)+'"]');
      var sub = $('#sub-'+CSS.escape(m.prefijo));
      var chev = row.querySelector('.f2-mchev');
      if(!q){
        row.style.display=''; sub.style.display='';
        var ab = leerAbiertos()[m.prefijo]===true;
        sub.hidden = !ab; chev.setAttribute('aria-expanded', ab);
        sub.querySelectorAll('a').forEach(function(a){a.style.display='';});
        algo=true; return;
      }
      var mMatch = m.n.toLowerCase().indexOf(q)>=0 || m.prefijo===q;
      var hits = 0;
      sub.querySelectorAll('a').forEach(function(a){
        var ok = mMatch || a.textContent.toLowerCase().indexOf(q)>=0;
        a.style.display = ok?'':'none';
        if(ok) hits++;
      });
      var vis = mMatch || hits>0;
      row.style.display = vis?'':'none';
      sub.style.display = vis?'':'none';
      sub.hidden = !vis; chev.setAttribute('aria-expanded', vis);
      if(vis) algo=true;
    });
    // oculta títulos de categoría sin macros visibles
    D.categorias.forEach(function(cat){
      var tit = [].slice.call(nav.querySelectorAll('.f2-cat-tit')).filter(function(t){return t.textContent===cat.n;})[0];
      if(!tit) return;
      var any = D.macros.filter(function(m){return m.cat===cat.id;}).some(function(m){
        var r = nav.querySelector('.f2-mrow[data-pref="'+CSS.escape(m.prefijo)+'"]');
        return r && r.style.display!=='none';
      });
      tit.style.display = any?'':'none';
    });
    $('#navNada').hidden = algo;
  }

  function marcarNav(tipo, id){
    nav.querySelectorAll('.f2-mrow.on').forEach(function(n){n.classList.remove('on');});
    nav.querySelectorAll('.f2-msub a.on').forEach(function(n){n.classList.remove('on');});
    $('.f2-navhome').classList.toggle('on', tipo==='inicio');
    if(tipo==='macro'){
      var r = nav.querySelector('.f2-mrow[data-pref="'+CSS.escape(id)+'"]');
      if(r) r.classList.add('on');
    }
    if(tipo==='proceso'){
      var x = proc(id); if(!x) return;
      var r = nav.querySelector('.f2-mrow[data-pref="'+CSS.escape(x.m.prefijo)+'"]');
      if(r) r.classList.add('on');
      var sub = $('#sub-'+CSS.escape(x.m.prefijo));
      var a = sub && sub.querySelector('a[data-cod="'+CSS.escape(id)+'"]');
      if(a){ a.classList.add('on'); }
      // abre el macro si el usuario no ha decidido lo contrario
      var o = leerAbiertos();
      if(o[x.m.prefijo]===undefined && sub){
        sub.hidden=false;
        var chev = r && r.querySelector('.f2-mchev'); if(chev) chev.setAttribute('aria-expanded', true);
      }
    }
  }

  // ---------- scroll-spy sobre el riel de secciones ----------
  var spy = null;
  function activarSpy(){
    if(spy) spy.disconnect();
    var secs = [].slice.call(doc.querySelectorAll('.f2-sec'));
    if(!secs.length) return;
    spy = new IntersectionObserver(function(ents){
      ents.forEach(function(en){
        if(!en.isIntersecting) return;
        var id = en.target.id;
        doc.querySelectorAll('.f2-riel a').forEach(function(a){
          a.classList.toggle('on', a.getAttribute('href')==='#'+id);
        });
      });
    }, {rootMargin:'-56px 0px -60% 0px', threshold:0});
    secs.forEach(function(s){spy.observe(s);});
  }

  function riel(secciones, base){
    return '<div class="f2-riel">'+secciones.map(function(s){
      return '<a href="#sec-'+esc(s.id)+'">'+esc(s.n)+'</a>';
    }).join('')+'</div>';
  }

  // ---------- vista: inicio ----------
  function vistaInicio(){
    var t = D.meta.totales;
    var h = '<div class="f2-kicker">UCAB Consultores · Grupo Kenex</div>';
    h += '<h1 class="f2-h1">manual de procesos — fase 2</h1>';
    h += '<p class="f2-lead">Sitio navegable de los manuales de proceso de Grupo Kenex. Se construye de forma incremental: el árbol y la ficha de cada proceso vienen del <b>Mapa de Procesos Actualizado '+esc(D.meta.version)+'</b> (validado por el equipo); el contenido de cada sección se completa cruzando las entrevistas, la documentación de Lark y buenas prácticas.</p>';
    h += '<span class="marca-estado e-alerta">En construcción</span>';

    h += '<div style="margin:16px 0 4px"><a class="btn btn-marca" href="#/mapa">Explorar el mapa de procesos →</a></div>';

    // totalizaciones — macroprocesos · procesos, con procesos desglosado por categoría
    h += '<div class="f2-tot">';
    h += '<div class="col-uno">'+kpi(t.macroprocesos, 'Macroprocesos', '3 categorías', 'lg')+'</div>'; // abarca la altura de toda la columna de procesos
    h += '<div class="col-dos">';
    h += kpi(t.procesos, 'Procesos', '', 'lg');
    h += '<div class="f2-deriv">';
    D.categorias.forEach(function(c){
      var x = t.categoria[c.id]; if(x) h += kpi(x.p, c.n, x.m+' macroprocesos', 'cat-'+c.id);
    });
    h += '</div></div></div>';

    // cobertura
    var tot = 0, val = 0;
    var procList = 0, macroList = 0;
    D.macros.forEach(function(m){
      var mOk = true;
      Object.keys(m.n0).forEach(function(k){tot++; if(est(m.n0[k])==='validado')val++; else mOk=false;});
      if(mOk) macroList++;
      m.procesos.forEach(function(p){
        var pOk = true;
        Object.keys(p.n1).forEach(function(k){tot++; if(est(p.n1[k])==='validado')val++; else pOk=false;});
        if(pOk) procList++;
      });
    });
    h += '<div class="f2-cober">';
    h += '<div class="cl">Avance — <b>'+procList+'</b>/'+t.procesos+' manuales de proceso completos · <b>'+macroList+'</b>/'+t.macroprocesos+' macroprocesos completos</div>';

        h += subtit('Descripción del flujo')+numLista(c.actividades);

      if(c.diagrama){

  function mpPuntos(a,b){
    var ra=mpRect(a), rb=mpRect(b); if(!ra||!rb) return null;
    var ca={x:ra.x+ra.w/2,y:ra.y+ra.h/2}, cb={x:rb.x+rb.w/2,y:rb.y+rb.h/2};
    if(Math.abs(cb.x-ca.x) >= Math.abs(cb.y-ca.y)){
      var dx = cb.x>ca.x?1:-1;
      return {p1:{x:dx>0?ra.x+ra.w:ra.x,y:ca.y}, p2:{x:dx>0?rb.x:rb.x+rb.w,y:cb.y}, h:true, dir:dx};
    }
    var dy = cb.y>ca.y?1:-1;
    return {p1:{x:ca.x,y:dy>0?ra.y+ra.h:ra.y}, p2:{x:cb.x,y:dy>0?rb.y:rb.y+rb.h}, h:false, dir:dy};
  }
  function mpPath(a,b){
    var q = mpPuntos(a,b); if(!q) return null;
    var p1=q.p1, p2=q.p2, h=q.h, dir=q.dir;
    var k = h ? Math.max(45,Math.min(200,Math.abs(p2.x-p1.x)/2)) : Math.max(45,Math.min(200,Math.abs(p2.y-p1.y)/2));
    var c1 = h ? {x:p1.x+dir*k,y:p1.y} : {x:p1.x,y:p1.y+dir*k};
    var c2 = h ? {x:p2.x-dir*k,y:p2.y} : {x:p2.x,y:p2.y-dir*k};
    return {d:'M'+p1.x+','+p1.y+' C'+c1.x+','+c1.y+' '+c2.x+','+c2.y+' '+p2.x+','+p2.y, p1:p1, p2:p2};
  }

  function mpDibujarWires(){
    var crucesOn = $('#mpCruces').classList.contains('on');
    mpWires.innerHTML =
      '<defs>'+
      '<marker id="mpfl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--f2-oper)"/></marker>'+
      '<marker id="mpflg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--tinta-tenue)"/></marker>'+
      '</defs>';

    function tenue(a,b){ return mpFoco && a!==mpFoco && b!==mpFoco; }

    // troncal (línea metro)
    MP.troncal.forEach(function(e){
      var pp = mpPath(e[0], e[1]); if(!pp) return;
      var op = tenue(e[0],e[1]) ? '.16' : '1';
      mpWires.appendChild(svg('path', {d:pp.d, stroke:'var(--fondo)', 'stroke-width':11, fill:'none', opacity:op}));
      mpWires.appendChild(svg('path', {d:pp.d, stroke:'var(--f2-oper)', 'stroke-width':6, fill:'none', 'marker-end':'url(#mpfl)', opacity:op}));
      [pp.p1, pp.p2].forEach(function(pt){
        mpWires.appendChild(svg('circle', {cx:pt.x, cy:pt.y, r:6, fill:'var(--fondo)', stroke:'var(--f2-oper)', 'stroke-width':3, opacity:op}));
      });
    });

    // entradas externas
    MP.entrada.forEach(function(e){
      var pp = mpPath(e[0], e[1]); if(!pp) return;
      var op = tenue(e[0],e[1]) ? '.16' : '1';
      mpWires.appendChild(svg('path', {d:pp.d, stroke:'var(--tinta-tenue)', 'stroke-width':2.4, 'stroke-dasharray':'2 5', fill:'none', 'marker-end':'url(#mpflg)', opacity:op}));
    });

    // cruces
    MP.cruces.forEach(function(e){
      var enfocado = mpFoco && (e[0]===mpFoco || e[1]===mpFoco);
      if(!crucesOn && !enfocado) return;
      var pp = mpPath(e[0], e[1]); if(!pp) return;
      var op = (mpFoco && !enfocado) ? '.12' : (enfocado ? '1' : '.7');
      mpWires.appendChild(svg('path', {d:pp.d, stroke:'var(--tinta-tenue)', 'stroke-width':2.2, 'stroke-dasharray':'7 5', fill:'none', 'marker-end':'url(#mpflg)', opacity:op}));
      if(e[2] && enfocado){
        var tx = svg('text', {x:(pp.p1.x+pp.p2.x)/2, y:(pp.p1.y+pp.p2.y)/2 - 7, 'text-anchor':'middle'});
        tx.textContent = e[2];
        mpWires.appendChild(tx);
      }
    });
  }

  // --- cámara: pan / zoom ---
  function mpFitRect(r, pad){
    pad = pad==null ? 80 : pad;
    var drw = $('#mpDrawer').classList.contains('abierto') ? 410 : 0;
    var vw = mpVp.clientWidth - drw, vh = mpVp.clientHeight;
    var s = Math.min((vw-pad*2)/r.w, (vh-pad*2)/r.h, 1.15);
    s = Math.max(.08, s);
    mpCam = {s:s, x:(vw-r.w*s)/2 - r.x*s, y:(vh-r.h*s)/2 - r.y*s};
    mpAplica();
  }
  function mpZonaDe(prefs){
    var x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
    prefs.forEach(function(k){ var r=mpRect(k); if(!r) return;
      x1=Math.min(x1,r.x); y1=Math.min(y1,r.y); x2=Math.max(x2,r.x+r.w); y2=Math.max(y2,r.y+r.h); });
    return {x:x1,y:y1,w:x2-x1,h:y2-y1};
  }
  var MP_ESCENAS = {
    general: function(){ return {x:0,y:0,w:MP.lienzo.w,h:MP.lienzo.h}; },
    cadena:  function(){ return mpZonaDe(['6','7','8','9','10','11','clientes','casio','fabricas']); },
    estr:    function(){ return mpZonaDe(['1','2','3','4','5']); },
    sop:     function(){ return mpZonaDe(['12','13','14','15','16','17','18','19','20']); }
  };
  function mpEscena(id){
    $('#mpEscenas').querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.esc===id); });
    var z = (MP_ESCENAS[id]||MP_ESCENAS.general)();
    mpConAnim(function(){ mpFitRect(z, id==='general'?50:90); });
  }
  function mpZoomAt(px,py,f){
    var ns = Math.min(2.2, Math.max(.08, mpCam.s*f)); f = ns/mpCam.s;
    mpCam.x = px-(px-mpCam.x)*f; mpCam.y = py-(py-mpCam.y)*f; mpCam.s = ns; mpAplica();
  }

  var mpPtrs = new Map(), mpLast=null, mpDist=0;
  mpVp.addEventListener('pointerdown', function(e){
    if(e.target.closest('.mp-drawer')) return;
    mpPtrs.set(e.pointerId, {x:e.clientX,y:e.clientY});
    mpVp.classList.add('arrastrando'); mpMoved=false; mpLast=null;
  });
  mpVp.addEventListener('pointermove', function(e){
    if(!mpPtrs.has(e.pointerId)) return;
    mpPtrs.set(e.pointerId, {x:e.clientX,y:e.clientY});
    var pts = Array.from(mpPtrs.values());
    if(pts.length===1){
      var p = pts[0];
      if(mpLast){ mpCam.x += p.x-mpLast.x; mpCam.y += p.y-mpLast.y;
        if(Math.hypot(p.x-mpLast.x,p.y-mpLast.y)>2) mpMoved=true; mpAplica(); }
      mpLast = {x:p.x,y:p.y};
    } else if(pts.length===2){
      var mid = {x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
      var d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if(mpLast && mpDist){ mpZoomAt(mid.x,mid.y,d/mpDist); mpCam.x += mid.x-mpLast.x; mpCam.y += mid.y-mpLast.y; mpAplica(); }
      mpLast = mid; mpDist = d; mpMoved = true;
    }
    if(mpMoved){ try{ if(!mpVp.hasPointerCapture(e.pointerId)) mpVp.setPointerCapture(e.pointerId); }catch(_){}}
  });
  function mpEndPtr(e){ mpPtrs.delete(e.pointerId); mpLast=null; mpDist=0; if(!mpPtrs.size) mpVp.classList.remove('arrastrando'); }
  mpVp.addEventListener('pointerup', mpEndPtr);
  mpVp.addEventListener('pointercancel', mpEndPtr);
  mpVp.addEventListener('wheel', function(e){ e.preventDefault(); mpZoomAt(e.clientX, e.clientY, Math.pow(1.0016,-e.deltaY)); }, {passive:false});
  $('#mpZin').addEventListener('click', function(){ mpConAnim(function(){ mpZoomAt(mpVp.clientWidth/2, mpVp.clientHeight/2, 1.4); }); });
  $('#mpZout').addEventListener('click', function(){ mpConAnim(function(){ mpZoomAt(mpVp.clientWidth/2, mpVp.clientHeight/2, 1/1.4); }); });
  $('#mpZfit').addEventListener('click', function(){ mpEscena('general'); });
  $('#mpEscenas').addEventListener('click', function(e){ var b=e.target.closest('button'); if(b) mpEscena(b.dataset.esc); });

  // --- foco + drawer ---
  var mpVecinos = {};
  function mpCalcVecinos(){
    [].concat(MP.troncal, MP.entrada.map(function(e){return [e[0],e[1]];}), MP.cruces.map(function(e){return [e[0],e[1]];}))
      .forEach(function(e){ (mpVecinos[e[0]]=mpVecinos[e[0]]||new Set()).add(e[1]); (mpVecinos[e[1]]=mpVecinos[e[1]]||new Set()).add(e[0]); });
  }
  mpCalcVecinos();

  function mpEnfocar(pref){
    if(!macro(pref)) return;
    mpFoco = pref;
    mapaSec.classList.add('enfoque');
    mpCanvas.querySelectorAll('.mp-nodo.on').forEach(function(n){ n.classList.remove('on'); });
    var set = new Set([pref]); (mpVecinos[pref]||new Set()).forEach(function(x){ set.add(x); });
    set.forEach(function(x){ var e=mpEl(x); if(e) e.classList.add('on'); });
    mpDibujarWires();
    mpAbrirDrawer(pref);
  }
  function mpDesenfocar(){
    mpFoco = null; mapaSec.classList.remove('enfoque');
    mpCanvas.querySelectorAll('.mp-nodo.on').forEach(function(n){ n.classList.remove('on'); });
    mpDibujarWires();
  }
  function mpAbrirDrawer(pref){
    var m = macro(pref); if(!m) return;
    $('#mpDnum').textContent = m.prefijo;
    $('#mpDtit').textContent = m.n;
    var h = '<div style="font-size:12px;color:var(--tinta-media)">'+esc(catNombre(m.cat))+' · '+m.procesos.length+' procesos</div>';
    h += '<a class="btn btn-marca" href="#/m/'+esc(m.prefijo)+'" style="align-self:flex-start">Abrir manual del macroproceso →</a>';
    h += '<div class="lst">'+m.procesos.map(function(p){
      return '<a href="#/p/'+esc(p.codigo)+'"><span class="c">'+esc(p.codigo)+'</span>'+esc(p.n)+'</a>';
    }).join('')+'</div>';
    $('#mpDbody').innerHTML = h;
    $('#mpDrawer').classList.add('abierto');
  }
  function mpCerrarDrawer(){ $('#mpDrawer').classList.remove('abierto'); }
  $('#mpDx').addEventListener('click', function(){ mpCerrarDrawer(); mpDesenfocar(); });

  mpCanvas.addEventListener('click', function(e){
    if(mpMoved) return;
    var n = e.target.closest('.mp-nodo');
    if(!n){ mpDesenfocar(); mpCerrarDrawer(); return; }
    var pref = n.getAttribute('data-pref');
    if(pref) mpEnfocar(pref);
  });
  mpCanvas.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ') return;
    var n = e.target.closest('.mp-nodo[data-pref]'); if(!n) return;
    e.preventDefault(); mpEnfocar(n.getAttribute('data-pref'));
  });

  // --- buscador ---
  function mpBuscar(q){
    q = (q||'').trim().toLowerCase(); if(!q) return;
    var hit = D.macros.filter(function(m){
      var pos = MP.nodos[m.prefijo]||{};
      return m.n.toLowerCase().indexOf(q)>=0 || (pos.corto||'').toLowerCase().indexOf(q)>=0 || m.prefijo===q;
    })[0];
    if(!hit) return;
    mpEnfocar(hit.prefijo);
    var r = mpRect(hit.prefijo);
    if(r) mpConAnim(function(){ mpFitRect({x:r.x-260,y:r.y-160,w:r.w+520,h:r.h+320}, 40); });
  }
  $('#mpBuscar').addEventListener('change', function(){ mpBuscar(this.value); });
  $('#mpBuscar').addEventListener('keydown', function(e){ if(e.key==='Enter') mpBuscar(this.value); });

  // --- toggle cruces ---
  $('#mpCruces').addEventListener('click', function(){
    var on = !this.classList.contains('on');
    this.classList.toggle('on', on); this.setAttribute('aria-pressed', on);
    mpDibujarWires();
  });

  addEventListener('keydown', function(e){
    if(e.key==='Escape' && !mapaSec.hidden){ if(mpFoco){ mpCerrarDrawer(); mpDesenfocar(); } }
  });

  function activarMapa(pref){
    mpConstruir();
    fbody.hidden = true; mapaSec.hidden = false;
    document.body.classList.remove('f2-menu');
    document.title = 'Mapa de procesos — Fase 2';
    // deja pintar el layout antes de medir/encuadrar
    requestAnimationFrame(function(){
      if(pref && macro(pref)){
        mpEnfocar(pref);
        var r = mpRect(pref);
        if(r) mpFitRect({x:r.x-280,y:r.y-180,w:r.w+560,h:r.h+360}, 40);
      } else {
        mpDesenfocar(); mpCerrarDrawer();
        mpEscena('general');
      }
    });
  }
  function salirMapa(){ mapaSec.hidden = true; fbody.hidden = false; }

  // ---------- enrutador ----------
  function router(){
    var raw = location.hash.replace(/^#\/?/, '');
    var parts = raw.split('/').filter(Boolean).map(decodeURIComponent);
    document.body.classList.remove('f2-menu');
    if(parts[0]==='mapa'){ return activarMapa(parts[1]); }
    salirMapa();
    if(!parts.length) return vistaInicio();
    if(parts[0]==='m') return vistaMacro(parts[1], parts[2]);
    if(parts[0]==='p') return vistaProceso(parts[1], parts[2]);
    vistaInicio();
  }

  // riel: clic en sub-sección sin recargar la vista
  doc.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('.f2-riel a');
    if(!a) return;
    e.preventDefault();
    var id = a.getAttribute('href').slice(1);
    var t = doc.querySelector('#'+CSS.escape(id));
    if(t) t.scrollIntoView({block:'start'});
  });

  // ---------- tema ----------
  $('#btnTema').addEventListener('click', function(){
    var osc = document.documentElement.getAttribute('data-tema')==='oscuro';
    document.documentElement.setAttribute('data-tema', osc?'claro':'oscuro');
    try{ localStorage.setItem('rower.tema', osc?'claro':'oscuro'); }catch(e){}
  });
  $('#btnMenu').addEventListener('click', function(){ document.body.classList.toggle('f2-menu'); });

  // ---------- arranque ----------
  pintarNav();
  window.addEventListener('hashchange', router);
  router();
})();
</script>
</body>
</html>
