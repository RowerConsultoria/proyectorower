<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arquitectura de IA — Fase 2 | Proyecto Rower</title>
<!-- Documentos de IA de la Fase 2: documento.html?d=tecnico|politica|casos|prototipos.
     El contenido vive en <d>-datos.js (editable a mano); lo pinta ia-doc.js. -->
<!-- Acceso: la misma guardia y el mismo permiso que el manual de la Fase 2. -->
<script src="../../../supabase/sesion.js" data-proteger data-permiso="ver.informe"></script>
<!-- Tema: sigue el del manual (data-tema claro|oscuro) cuando vive dentro de su marco. -->
<script>(function(){function t(){var m=null;try{if(window.parent&&window.parent!==window) m=window.parent.document.documentElement.getAttribute('data-tema');}catch(e){}
if(!m){try{m=localStorage.getItem('rower.tema')==='oscuro'?'oscuro':'claro';}catch(e){m='claro';}}
document.documentElement.setAttribute('data-theme',m==='oscuro'?'dark':'light');}
t();try{if(window.parent!==window) new MutationObserver(t).observe(window.parent.document.documentElement,{attributes:true,attributeFilter:['data-tema']});}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="ia-doc.css">
</head>
<body>
<div id="iad" class="iad" aria-busy="true"></div>
<script src="ia-doc.js"></script>
</body>
</html>
