    <li id="r-onet">O*NET Resource Center, Departamento de Trabajo de EE. UU. <i>Job Zones</i>. <a href="https://www.onetonline.org/help/online/zones">onetonline.org</a><span class="uso">Cinco zonas según la preparación que exige la ocupación, con su tramo SVP: zonas 1–2 por debajo de SVP 6; zona 3, SVP 6 a 7; zona 4, SVP 7 a 8 (<q>varios años</q> de experiencia, por ejemplo gerentes de ventas y directores de arte); zona 5, SVP 8 o más (<q>muchas piden más de cinco años</q>).</span></li>
  </ol>
  <p class="pie">Fuentes internas: estructura To-Be de Kenex al 10-nov-2026 (capas, niveles, unidades, estructura patrón, principios y decisiones pendientes). Las premisas citadas son las fijadas el 10-nov-2026 para desarrollar la capa país.</p>
</section>
</div>
</template>

<script src="descripciones-datos.js"></script>
<script>
(function(){
  var D = window.DESCRIPCIONES_CARGO, M = D.meta;
  var $ = function(s){ return document.querySelector(s); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var POR_NOMBRE = {}; Object.keys(D.descripciones).forEach(function(id){ POR_NOMBRE[D.descripciones[id].denominacion] = id; });
  var TOTAL = new Set(); D.familias.forEach(function(f){ f.cargos.forEach(function(c){ TOTAL.add(c); }); });

  // Escalas de la Sección IV (de menor a mayor), para pintar dónde cae cada grado
  var GRADOS = {
    'Dinero y bienes': ['Ninguna', 'Manejo general de bienes', 'Administración presupuestaria', 'Manejo financiero e inversiones'],
    'Equipos': ['Simple', 'Media', 'Alta'],
    'Gestión de procesos': ['Auxiliares', 'Profesionales', 'De supervisión y coordinación', 'Gerenciales'],
    'Personas': ['Ninguna', 'Un número determinado de personas', 'Un equipo responsable de una función', 'Equipos responsables de un subproceso', 'Equipos de un área o dirección'],
    'Atención a clientes': ['Simple entrega', 'Esmero con el cliente', 'Atención especial', 'Excepcional']
  };
  var ICONO = { 'Biológicos': '🦠', 'Físicos': '💡', 'Químicos': '🧪', 'Mecánicos': '⚙️', 'Psicosociales': '🧠', 'Disergonómicos': '🪑' };

  function inicio(){
    var hechas = Object.keys(D.descripciones).length, pct = Math.round(hechas / TOTAL.size * 100);
    var h = '<section class="hero"><div class="k">Fase 3 · Talento · Grupo Kenex</div><h1>Descripciones de cargo</h1>' +
      '<p>Una por cargo de la estructura To-Be: qué asegura cada cargo, de qué procesos responde, qué perfil exige y a qué riesgos está expuesto. ' +
      'Parten del manual de procesos To-Be y pasan por la validación del equipo antes de darse por definitivas.</p>' +
      '<div class="stats"><div class="stat"><b>' + TOTAL.size + '</b><span>descripciones previstas</span></div><div class="stat"><b>' + D.familias.length + '</b><span>familias de cargos</span></div>' +
      '<div class="stat"><b>' + hechas + '</b><span>en borrador</span></div><div class="stat"><b>0</b><span>validadas</span></div></div>' +
      '<div class="progreso"><div class="bar"><i style="width:' + Math.max(pct, 2) + '%"></i></div><small>' + pct + ' % redactado · piloto en curso: Servicios Generales</small></div></section>';
    h += '<div class="tit2"><h2>Familias de cargos</h2><input class="buscar" id="buscar" type="search" placeholder="Buscar familia o cargo…" aria-label="Buscar familia o cargo"></div><div class="fams" id="fams">';
    var orden = D.familias.slice().sort(function(a, b){ return (b.piloto ? 1 : 0) - (a.piloto ? 1 : 0); });
    orden.forEach(function(f){
      // una descripción compartida solo cuenta en la familia cuyos matices ya están redactados
      var listos = f.cargos.filter(function(c){ var d = D.descripciones[POR_NOMBRE[c]];
        return d && (!d.matices || d.matices.some(function(m){ return m.codigos_v5.some(function(x){ return x.indexOf(f.id + '-') === 0; }); })); }).length;
      h += '<article class="famc' + (f.piloto ? ' piloto' : '') + '" data-q="' + esc((f.nombre + ' ' + f.unidad + ' ' + f.cargos.join(' ')).toLowerCase()) + '">' +
        '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h3>' + esc(f.nombre) + '</h3><div class="u">' + esc(f.unidad) + '</div></div>' +
        (f.piloto ? '<span class="badge piloto">● Piloto</span>' : '<span class="badge pend">Pendiente</span>') + '</div>';
      if (f.piloto) h += '<div class="cargos">' + f.cargos.map(function(c){ var id = POR_NOMBRE[c];
        return id ? '<a href="#/c/' + id + '">' + esc(c) + '</a>' : '<span>' + esc(c) + '</span>'; }).join('') + '</div>';
      h += '<div class="pie"><span>' + f.cargos.length + (f.cargos.length === 1 ? ' cargo' : ' cargos') + '</span><span>' + listos + ' en borrador</span></div></article>';
    });
    return h + '</div>';
  }

  function org(sup, yo, subs, unidad){
    var h = '<div class="org">' + (unidad ? '<div class="unidadorg">' + esc(unidad) + '</div>' : '') +
      '<div class="nodo"><small>Reporta a</small>' + esc(sup) + '</div><div class="v"></div><div class="nodo yo"><small>Este cargo</small>' + esc(yo) + '</div>';
    if (subs.length){
      var p = 50 / subs.length;
      h += '<div class="v"></div><div class="hijos" style="--l:' + p + '%;--r:' + p + '%">' + subs.map(function(s){ return '<div><div class="nodo"><small>Supervisa</small>' + esc(s) + '</div></div>'; }).join('') + '</div>';
    }
    return h + '</div>';
  }
  function procs(rs){
    return '<div class="procs">' + rs.map(function(g){
      return '<section class="proc' + (g.proceso ? '' : ' otras') + '"><header><div><span>' + (g.proceso ? 'Asociadas al proceso de' : 'Responsabilidades') + '</span><h4>' + esc(g.proceso || g.titulo) + '</h4></div><em>' + g.items.length + '</em></header><ul>' +
        g.items.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></section>';
    }).join('') + '</div>';
  }
  function nivel(n){ var h = '<span class="nivel" title="Nivel exigido: ' + n + ' de 4">'; for (var i = 1; i <= 4; i++) h += '<i class="' + (i <= n ? 'on' : '') + '"></i>'; return h + '</span>'; }
  function factor(nombre, valor){
    var g = GRADOS[nombre];
    if (!g) return '<div class="factor"><small>' + esc(nombre) + '</small><b class="sino' + (valor === 'Sí' ? ' si' : '') + '"><i></i>' + esc(valor) + '</b></div>';
    var idx = g.findIndex(function(x){ return valor.indexOf(x) === 0; });
    return '<div class="factor"><small>' + esc(nombre) + '</small><b>' + esc(valor) + '</b><div class="escala" title="Grado ' + (idx + 1) + ' de ' + g.length + '">' +
      g.map(function(_, i){ return '<i class="' + (i <= idx ? 'on' : '') + '"></i>'; }).join('') + '</div></div>';
  }

  function cargo(id){
    var c = D.descripciones[id]; if (!c) return '<p>No existe esa descripción.</p>';
    var hermanos = D.familias.filter(function(f){ return f.piloto; })[0];
    var compartida = c.matices && c.matices.length, co = c.competencias, t = c.tecnicas;
    var SECS = [['s1', 'I', 'Información del cargo'], ['s2', 'II', 'Responsabilidades'], ['s3', 'III', 'Competencias y perfil'], ['s4', 'IV', 'Información importante'], ['s5', 'V', 'Riesgos laborales'], ['s6', '✎', 'Control y notas']];
    var h = '<div class="ficha"><nav class="riel" id="riel"><a class="volver" href="#/descripciones">← Todas las familias</a>' +
      SECS.map(function(s){ return '<a class="s" href="#' + s[0] + '" data-s="' + s[0] + '"><b>' + s[1] + '</b>' + s[2] + '</a>'; }).join('') +
      (hermanos ? '<div class="otros"><p>' + esc(hermanos.nombre) + '</p>' + hermanos.cargos.map(function(n){ var i = POR_NOMBRE[n];
        return i ? '<a class="' + (i === id ? 'on' : '') + '" href="#/c/' + i + '">' + esc(n) + '</a>' : ''; }).join('') + '</div>' : '') + '</nav><div>';

    h += '<header class="cab"><div class="k">Descripción de Cargo/Rol <span class="badge">' + esc(M.estado) + '</span></div><h1>' + esc(c.denominacion) + '</h1><div class="datos">' +
      '<div class="dato"><small>Unidad</small><b>' + esc(c.unidad) + '</b></div><div class="dato"><small>Reporta a</small><b>' + esc(c.reporta_a) + '</b></div>' +
      '<div class="dato"><small>Código</small><b>' + esc(c.codigo || 'Por definir') + ' · V5 ' + esc(c.codigos_v5.length > 3 ? c.codigos_v5.length + ' códigos' : c.codigos_v5.join(' · ')) + '</b></div>' +
      '<div class="dato"><small>Situación</small><b>' + esc(c.situacion) + '</b></div></div><p class="objetivo">' + esc(c.objetivo) + '</p></header>';

    h += '<section class="bloque" id="s1"><h2><b>I</b>Información del cargo/rol</h2><p class="sub">Posición en la organización y líneas de reporte.</p>';
    if (compartida) c.matices.forEach(function(m){ h += org(m.reporta_a, c.denominacion, c.supervisa_a, m.unidad); });
    else h += org(c.reporta_a, c.denominacion, c.supervisa_a);
    h += '<p style="text-align:center;color:var(--muted);font-size:.9rem;margin:10px 0 0">Supervisa a: ' + (c.supervisa_a.length ? esc(c.supervisa_a.join(' · ')) : 'no aplica') + '</p></section>';

    var nItems = c.responsabilidades.reduce(function(a, g){ return a + g.items.length; }, 0);
    h += '<section class="bloque" id="s2"><h2><b>II</b>Responsabilidad por procesos</h2><p class="sub">' + nItems + ' responsabilidades' + (compartida ? ' comunes' : '') + ', agrupadas por el proceso del manual To-Be al que pertenecen.</p>' + procs(c.responsabilidades);
    if (compartida) c.matices.forEach(function(m){ h += '<div class="matiz"><h3>Matices de ' + esc(m.unidad) + ' <span class="badge pend">' + esc(m.codigos_v5.join(' · ')) + '</span></h3>' + procs(m.responsabilidades) + '</div>'; });
    h += '<p class="clausula">' + esc(M.clausula) + '</p></section>';

    h += '<section class="bloque" id="s3"><h2><b>III</b>Perfil de competencias exigidas</h2><p class="sub">Propuesta de diccionario de la Fase 3 · tramo ' + esc(co.tramo) + '.</p>' +
      '<h3 class="m">Competencias genéricas · nivel exigido ' + nivel(co.nivel.genericas) + '</h3><div class="chips">' + M.genericas.map(function(g){ return '<span class="chip">' + esc(g) + '</span>'; }).join('') + '</div>' +
      '<h3 class="m">Competencias del cargo/rol · nivel exigido ' + nivel(co.nivel.del_cargo) + '</h3><div class="chips">' + co.del_cargo.map(function(g){ return '<span class="chip alt">' + esc(g) + '</span>'; }).join('') + '</div>' +
      '<h3 class="m">Competencias técnicas</h3><div class="perfil"><div class="tarjeta"><small>🎓 Formación</small><p>' + esc(t.formacion) + '</p></div><div class="tarjeta"><small>⏱ Experiencia</small><p>' + esc(t.experiencia) + '</p></div></div>' +
      '<h3 class="m">Habilidades y destrezas</h3><ul class="lista2">' + t.habilidades.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>';

    h += '<section class="bloque" id="s4"><h2><b>IV</b>Información importante a considerar</h2><p class="sub">Responsabilidades específicas: dónde cae el cargo en cada factor.</p><div class="factores">' +
      M.factores.map(function(f){ return factor(f, c.especificas[f]); }).join('') + '</div>' +
      '<div class="rel" style="margin-top:6px"><div><h3 class="m">Relaciones internas</h3><ul class="lista2" style="grid-template-columns:1fr">' + c.relaciones.internas.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
      '<div><h3 class="m">Relaciones externas</h3><ul class="lista2" style="grid-template-columns:1fr">' + c.relaciones.externas.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
      '<div><h3 class="m">Marco normativo</h3><ul class="lista2" style="grid-template-columns:1fr">' + c.marco_normativo.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div></div></section>';

    h += '<section class="bloque" id="s5"><h2><b>V</b>Riesgos laborales asociados</h2><p class="sub">' + esc(M.intro_riesgos) + '</p><div class="riesgos">' +
      M.riesgos.map(function(r){ var on = !!c.riesgos_laborales[r]; return '<div class="rg' + (on ? ' on' : '') + '"><div class="ic" aria-hidden="true">' + ICONO[r] + '</div><b>' + esc(r) + '</b><span>' + (on ? 'Aplica' : 'No aplica') + '</span></div>'; }).join('') + '</div><div class="rgdet">' +
      M.riesgos.filter(function(r){ return c.riesgos_laborales[r]; }).map(function(r){ return '<div><b>' + esc(r) + ':</b> ' + esc(c.riesgos_laborales[r]) + '</div>'; }).join('') + '</div>' +
      (c.riesgos_nota ? '<p style="color:var(--muted);font-size:.86rem;margin:10px 0 0">' + esc(c.riesgos_nota) + '</p>' : '') + '</section>';

    h += '<section class="bloque" id="s6"><h2><b>✎</b>Control del documento</h2><p class="sub">Se completa en la validación.</p><div class="control">' +
      ['Elaborado por', 'Revisado por', 'Aprobado por'].map(function(x){ return '<div><small>' + x + '</small><span>Pendiente de validación</span></div>'; }).join('') + '</div>' +
      (c.notas && c.notas.length ? '<div class="notas"><h3>Notas para la validación del equipo</h3><ul>' + c.notas.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>' : '') + '</section>';
    return h + '</div></div>';
  }

  var VISTA = null, espia = null;
  var PATRON_SECS = [['escalera', 'La escalera'], ['leer', 'Cómo leer un escalón'], ['equipos', 'Del operario al coordinador'], ['direccion', 'Gerentes y director'],
    ['equivalencias', 'Equivalencias con los marcos'], ['reglas', 'Reglas de diseño'], ['decisiones', 'Decisiones abiertas'], ['referencias', 'Referencias']];
  function armarIndice(){
    var piloto = D.familias.filter(function(f){ return f.piloto; })[0];
    $('#ixPatron').innerHTML = PATRON_SECS.map(function(s){ return '<a href="#/patron/' + s[0] + '" data-a="' + s[0] + '">' + s[1] + '</a>'; }).join('');
    $('#ixDesc').innerHTML = '<a href="#/descripciones" data-a="familias">Familias de cargos</a>' + (piloto ? piloto.cargos.map(function(n){ var i = POR_NOMBRE[n];
      return i ? '<a href="#/c/' + i + '" data-c="' + i + '">' + esc(n) + '</a>' : ''; }).join('') : '');
  }
  function marcarIndice(vista, id){
    document.querySelectorAll('.ix-p').forEach(function(a){ a.classList.toggle('on', a.dataset.v === (vista === 'patron' ? 'patron' : 'desc')); });
    $('#ixPatron').classList.toggle('abierto', vista === 'patron');
    $('#ixDesc').classList.toggle('abierto', vista !== 'patron');
    document.querySelectorAll('#ixDesc a').forEach(function(a){ a.classList.toggle('on', vista === 'cargo' ? a.dataset.c === id : a.dataset.a === 'familias'); });
  }
  function irA(id){
    var el = document.getElementById(id); if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.querySelectorAll('.resalta').forEach(function(x){ x.classList.remove('resalta'); });
    if (el.matches('section.blk, .bloque')) return;   // una sección entera no se resalta: solo fichas y referencias
    el.classList.add('resalta'); setTimeout(function(){ el.classList.remove('resalta'); }, 1800);
  }
  function montar(vista){
    if (espia){ espia.disconnect(); espia = null; }
    if (vista === 'cargo'){
      espia = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) document.querySelectorAll('#riel a.s').forEach(function(a){ a.classList.toggle('on', a.dataset.s === e.target.id); }); }); }, { rootMargin: '-30% 0px -60% 0px' });
      document.querySelectorAll('.bloque').forEach(function(b){ espia.observe(b); });
    } else if (vista === 'patron'){
      espia = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) document.querySelectorAll('#ixPatron a').forEach(function(a){ a.classList.toggle('on', a.dataset.a === e.target.id); }); }); }, { rootMargin: '-20% 0px -70% 0px' });
      document.querySelectorAll('.ep section.blk[id]').forEach(function(b){ espia.observe(b); });
    } else {
      var q = $('#buscar');
      if (q) q.addEventListener('input', function(){ var v = q.value.trim().toLowerCase();
        document.querySelectorAll('.famc').forEach(function(f){ f.style.display = !v || f.dataset.q.indexOf(v) >= 0 ? '' : 'none'; }); });
    }
  }
  function router(){
    var r = (location.hash || '#/').replace(/^#/, '');
    if (r.charAt(0) !== '/') return;   // anclas sueltas: no rehacer la vista
    var m = r.match(/^\/c\/([\w-]+)/), pa = r.match(/^\/patron\/([\w-]+)/);
    var vista = m ? 'cargo' : /^\/descripciones/.test(r) ? 'desc' : 'patron';
    var clave = vista + (m ? ':' + m[1] : '');
    if (clave !== VISTA){
      $('#vista').innerHTML = vista === 'cargo' ? cargo(m[1]) : vista === 'desc' ? inicio() : $('#tplPatron').innerHTML;
      VISTA = clave;
      if (!pa) window.scrollTo(0, 0);
      montar(vista);
    }
    marcarIndice(vista, m && m[1]);
    $('#btnImprimir').hidden = vista !== 'cargo';
    document.title = (vista === 'cargo' && D.descripciones[m[1]] ? D.descripciones[m[1]].denominacion + ' — Descripciones de cargo' : vista === 'desc' ? 'Descripciones de cargo' : 'Estructura patrón de cargos') + ' — Fase 3 | Proyecto Rower';
    if (pa) setTimeout(function(){ irA(pa[1]); }, 40);
  }
  // Enlaces a #<id> dentro de la vista: se desplazan sin tocar la ruta del hash.
  // Un enlace del índice a la sección en la que ya se está tampoco cambia el hash: se desplaza.
  document.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null; if (!a) return;
    var h = a.getAttribute('href'), pa = h.match(/^#\/patron\/([\w-]+)$/);
    if (pa && h === location.hash){ e.preventDefault(); irA(pa[1]); return; }
    if (h.charAt(1) === '/' || !document.getElementById(h.slice(1))) return;
    e.preventDefault(); irA(h.slice(1));
  });
  armarIndice();
  var fs = $('#faseSel'), fb = $('#faseBtn');
  fb.addEventListener('click', function(e){ e.stopPropagation(); fs.classList.toggle('open'); fb.setAttribute('aria-expanded', fs.classList.contains('open')); });
  document.addEventListener('click', function(){ fs.classList.remove('open'); fb.setAttribute('aria-expanded', 'false'); });
  $('#btnImprimir').addEventListener('click', function(){ window.print(); });
  $('#btnTema').addEventListener('click', function(){
    var oscuro = document.documentElement.getAttribute('data-theme') !== 'dark';
    document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
    try { localStorage.setItem('rower.tema', oscuro ? 'oscuro' : 'claro'); } catch(e){}
  });
  window.addEventListener('hashchange', router);
  router();
})();
</script>
</body>
