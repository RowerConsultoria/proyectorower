<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Talento — Fase 3 | Proyecto Rower</title>
<!-- Fase 3 · Talento. Índice a la izquierda con dos puntos:
     1 Estructura patrón de cargos (#/ o #/patron[/<sección>]): HTML en <template id="tplPatron">, con sus estilos
       bajo .ep. Vino del artefacto «Escalones de la estructura patrón» (10-nov-2026) y se edita a mano aquí.
     2 Descripciones de cargo (#/descripciones y #/c/<id>). Fuente única: descripciones-datos.js (se edita a mano).
       Cada descripción sigue el «Esquema_Descripcion_de_Cargo» v0.2; lo automático (organigrama, cláusula final,
       texto de la Sección V y control del documento) lo pone esta página.
     Los enlaces #<id> dentro de una vista se desplazan sin cambiar la ruta (delegado de clics al final). -->
<script src="../../supabase/sesion.js" data-proteger data-permiso="ver.informe"></script>
<script>(function(){var m='claro';try{m=localStorage.getItem('rower.tema')==='oscuro'?'oscuro':'claro';}catch(e){}
document.documentElement.setAttribute('data-theme',m==='oscuro'?'dark':'light');})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface2:#F8FAFD; --fg:#14213A; --muted:#5D6A7E; --line:#DCE3EE; --soft:#EAF1FA;
  --navy:#1F3864; --blue:#2E75B6; --sky:#5BA3E0; --ok:#2E7D32; --warn:#B26A00; --risk:#C00000;
  --chip:#E6EEF9; --chipfg:#1F3864; --shadow:0 1px 2px rgba(20,33,58,.06),0 8px 24px rgba(20,33,58,.07);
  --hero1:#1F3864; --hero2:#2E75B6; --herofg:#FFFFFF; --r:14px;
  --f:"DM Sans",Calibri,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#121C2E; --surface2:#16223A; --fg:#E6ECF5; --muted:#9AA8BC; --line:#25344E; --soft:#182640;
  --navy:#BFD3F2; --blue:#6FAAE4; --sky:#8CC0EE; --ok:#71C277; --warn:#E3A24E; --risk:#F27A7A;
  --chip:#1C2D4A; --chipfg:#CFE0F7; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --hero1:#12264A; --hero2:#1E4F86; --herofg:#EAF2FC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121C2E; --surface2:#16223A; --fg:#E6ECF5; --muted:#9AA8BC; --line:#25344E; --soft:#182640;
  --navy:#BFD3F2; --blue:#6FAAE4; --sky:#8CC0EE; --ok:#71C277; --warn:#E3A24E; --risk:#F27A7A;
  --chip:#1C2D4A; --chipfg:#CFE0F7; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --hero1:#12264A; --hero2:#1E4F86; --herofg:#EAF2FC; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button{font:inherit}

/* barra superior */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px clamp(16px,3vw,32px);
  background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-weight:700}
.marca i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--sky),var(--navy) 70%);box-shadow:0 0 0 3px var(--soft)}
.marca small{display:block;font-weight:500;color:var(--muted);font-size:.75rem;line-height:1}
.fasesel{position:relative;margin-left:8px}
.fasesel>button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.86rem;cursor:pointer}
.fasesel .menu{display:none;position:absolute;left:0;top:calc(100% + 6px);min-width:270px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.fasesel.open .menu{display:block}
.fasesel .menu a{display:block;padding:10px 14px;text-decoration:none;color:var(--fg);font-weight:600;font-size:.9rem;border-bottom:1px solid var(--line)}
.fasesel .menu a:last-child{border-bottom:0}
.fasesel .menu a.actual{background:var(--soft)}
.fasesel .menu small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.top .sp{flex:1}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:.84rem;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.pill:hover{border-color:var(--blue)}

.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,32px) 72px}

/* portada */
.hero{margin:22px 0 26px;border-radius:22px;padding:clamp(24px,4vw,44px);color:var(--herofg);
  background:radial-gradient(1200px 400px at 85% -20%,rgba(91,163,224,.45),transparent 60%),linear-gradient(135deg,var(--hero1),var(--hero2));
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:280px;height:280px;border-radius:50%;border:40px solid rgba(255,255,255,.07)}
.hero .k{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hero h1{font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1.1;margin:8px 0 10px;letter-spacing:-.02em}
.hero p{max-width:66ch;opacity:.9;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:26px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 16px}
.stat b{display:block;font-size:1.8rem;line-height:1.1}
.stat span{font-size:.84rem;opacity:.85}
.progreso{margin-top:18px;position:relative;z-index:1}
.progreso .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.progreso .bar i{display:block;height:100%;background:linear-gradient(90deg,#9FD1FF,#FFFFFF);border-radius:99px}
.progreso small{display:block;margin-top:6px;opacity:.85;font-size:.82rem}

.tit2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px}
.tit2 h2{margin:0;font-size:1.2rem;letter-spacing:-.01em}
.tit2 span{color:var(--muted);font-size:.88rem}
.buscar{width:100%;max-width:360px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 16px;font:inherit}
.fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;align-items:start}
.famc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.famc.piloto{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--warn) 7%,var(--surface)),var(--surface) 60%)}
.famc h3{margin:0;font-size:1rem;line-height:1.25}
.famc .u{color:var(--muted);font-size:.82rem}
.famc .cargos{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.famc .cargos a,.famc .cargos span{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface2);text-decoration:none;color:var(--fg);font-size:.9rem;border:1px solid transparent}
.famc .cargos a:hover{border-color:var(--blue);background:var(--soft)}
.famc .cargos a::after{content:"→";color:var(--blue);font-weight:700}
.famc .cargos span{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.badge.piloto{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge.pend{background:var(--chip);color:var(--muted)}
.badge.borr{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.famc .pie{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.82rem;margin-top:auto}

/* ficha */
.ficha{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;margin-top:22px}
.riel{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px}
.riel .volver{font-size:.86rem;font-weight:600;text-decoration:none;margin-bottom:12px}
.riel a.s{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:.88rem;font-weight:500}
.riel a.s b{display:inline-flex;width:24px;height:24px;border-radius:7px;align-items:center;justify-content:center;background:var(--chip);color:var(--chipfg);font-size:.72rem}
.riel a.s.on,.riel a.s:hover{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.riel a.s.on b{background:var(--navy);color:var(--surface)}
.riel .otros{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.riel .otros p{margin:0 0 6px;font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.riel .otros a{display:block;padding:5px 10px;font-size:.84rem;text-decoration:none;color:var(--fg);border-radius:8px}
.riel .otros a.on{color:var(--blue);font-weight:600}

.cab{border-radius:20px;padding:clamp(20px,3vw,34px);color:var(--herofg);background:radial-gradient(900px 300px at 90% -30%,rgba(91,163,224,.45),transparent 60%),linear-gradient(135deg,var(--hero1),var(--hero2));box-shadow:var(--shadow)}
.cab .k{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cab .k .badge{background:rgba(255,255,255,.16);color:#fff}
.cab h1{margin:8px 0 14px;font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.12;letter-spacing:-.02em}
.cab .datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cab .dato{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px 14px}
.cab .dato small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.cab .dato b{font-weight:600;font-size:.94rem}
.objetivo{margin:18px 0 0;font-size:1.04rem;line-height:1.6;background:rgba(255,255,255,.08);border-left:3px solid #9FD1FF;padding:12px 16px;border-radius:0 12px 12px 0}

.bloque{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,2.6vw,28px);margin-top:18px;box-shadow:var(--shadow);scroll-margin-top:84px}
.bloque>h2{display:flex;align-items:center;gap:12px;margin:0 0 4px;font-size:1.15rem;letter-spacing:-.01em}
.bloque>h2 b{display:inline-flex;min-width:34px;height:34px;padding:0 8px;border-radius:10px;align-items:center;justify-content:center;background:var(--navy);color:var(--surface);font-size:.86rem}
.bloque>.sub{color:var(--muted);margin:0 0 16px 46px;font-size:.88rem}
h3.m{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:20px 0 10px}

/* organigrama */
.org{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;overflow-x:auto}
.nodo{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-align:center;font-size:.9rem;font-weight:600;min-width:180px;max-width:280px;box-shadow:var(--shadow)}
.nodo small{display:block;font-weight:500;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.nodo.yo{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-color:transparent}
.nodo.yo small{color:rgba(255,255,255,.8)}
.v{width:2px;height:20px;background:var(--line)}
.hijos{display:flex;gap:14px;position:relative;padding-top:20px}
.hijos::before{content:"";position:absolute;top:0;left:var(--l);right:var(--r);height:2px;background:var(--line)}
.hijos>div{position:relative;display:flex;flex-direction:column;align-items:center}
.hijos>div::before{content:"";position:absolute;top:-20px;left:50%;width:2px;height:20px;background:var(--line)}
.unidadorg{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:4px 0 8px}

/* responsabilidades */
.procs{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.proc{border:1px solid var(--line);border-radius:14px;padding:14px 16px 6px;background:var(--surface2)}
.proc header{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.proc header span{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.proc header h4{margin:2px 0 0;font-size:.98rem;line-height:1.3}
.proc header em{font-style:normal;flex:0 0 auto;font-size:.75rem;font-weight:700;color:var(--chipfg);background:var(--chip);border-radius:999px;padding:3px 9px}
.proc.otras{background:var(--surface);border-style:dashed}
.proc ul{list-style:none;margin:0;padding:0}
.proc li{position:relative;padding:7px 0 7px 22px;border-top:1px solid var(--line);font-size:.92rem}
.proc li:first-child{border-top:0}
.proc li::before{content:"";position:absolute;left:4px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.clausula{margin:14px 2px 0;color:var(--muted);font-style:italic;font-size:.9rem}
.matiz{margin-top:18px;border-radius:16px;padding:16px;background:color-mix(in srgb,var(--blue) 6%,var(--surface));border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line))}
.matiz>h3{margin:0 0 12px;font-size:1rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* competencias */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);color:var(--chipfg);border-radius:999px;padding:6px 13px;font-size:.86rem;font-weight:600}
.chip.alt{background:transparent;border:1.5px solid var(--blue);color:var(--blue)}
.nivel{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.nivel i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.nivel i.on{background:var(--blue)}
.perfil{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tarjeta{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface2)}
.tarjeta small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
.tarjeta p{margin:0;font-size:.93rem}
.lista2{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 18px}
.lista2 li{padding-left:20px;position:relative;font-size:.92rem}
.lista2 li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:700}

/* factores */
.factores{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.factor{border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:var(--surface2)}
.factor small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.factor b{display:block;font-size:.95rem;margin:2px 0 8px}
.escala{display:flex;gap:4px}
.escala i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.escala i.on{background:linear-gradient(90deg,var(--blue),var(--sky))}
.sino{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.sino i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.sino.si i{background:var(--ok)}
.rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}

/* riesgos */
.riesgos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:6px 0 16px}
.rg{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:var(--surface2);opacity:.55}
.rg.on{opacity:1;border-color:color-mix(in srgb,var(--risk) 45%,var(--line));background:color-mix(in srgb,var(--risk) 6%,var(--surface))}
.rg .ic{font-size:1.4rem;line-height:1}
.rg b{display:block;font-size:.88rem;margin-top:4px}
.rg span{font-size:.74rem;color:var(--muted)}
.rgdet{display:grid;gap:8px}
.rgdet div{border-left:3px solid var(--risk);padding:6px 12px;background:var(--surface2);border-radius:0 10px 10px 0;font-size:.92rem}

.control{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.control div{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;min-height:78px}
.control small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.control span{color:var(--muted);font-size:.88rem}
.notas{margin-top:18px;border-radius:16px;padding:16px 18px;background:color-mix(in srgb,var(--warn) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line))}
.notas h3{margin:0 0 8px;font-size:.95rem;color:var(--warn)}
.notas ul{margin:0;padding-left:20px}
.notas li{margin:4px 0;font-size:.92rem}

@media (max-width:960px){
  .ficha{grid-template-columns:1fr}
  .riel{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
  .riel .otros{display:none}
  .riel a.s{padding:6px 10px;background:var(--surface);border:1px solid var(--line)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .procs{grid-template-columns:1fr}
  .riesgos{grid-template-columns:repeat(3,minmax(0,1fr))}
  .marca small{display:none}
}
@media (max-width:640px){
  .hijos{flex-direction:column;gap:10px;padding-top:0}
  .hijos::before{display:none}
  .hijos>div::before{top:-10px;height:10px}
}
@media (max-width:560px){
  .top{flex-wrap:wrap}
  .control{grid-template-columns:1fr}
  .fasesel{margin-left:0}
}

/* índice de la Fase 3 (izquierda) */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;max-width:1500px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}
.shell>.wrap{max-width:none;margin:0;padding:0 0 72px;min-width:0}
.ix{position:sticky;top:60px;align-self:start;max-height:calc(100vh - 70px);overflow:auto;padding:22px 0 24px;display:flex;flex-direction:column;gap:2px}
.ix-fase{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px 10px;font-weight:700}
.ix-p{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--fg);font-weight:600;font-size:.92rem;line-height:1.3}
.ix-p b{display:inline-flex;min-width:24px;height:24px;border-radius:7px;align-items:center;justify-content:center;background:var(--chip);color:var(--chipfg);font-size:.75rem;flex:none}
.ix-p:hover{background:var(--surface)}
.ix-p.on{background:var(--surface);box-shadow:var(--shadow)}
.ix-p.on b{background:var(--navy);color:var(--surface)}
.ix-sub{display:none;flex-direction:column;margin:4px 0 10px 22px;border-left:1px solid var(--line)}
.ix-sub.abierto{display:flex}
.ix-sub a{padding:5px 12px;font-size:.84rem;color:var(--muted);text-decoration:none;margin-left:-1px;border-left:2px solid transparent;line-height:1.35}
.ix-sub a:hover{color:var(--fg)}
.ix-sub a.on{color:var(--blue);border-left-color:var(--blue);font-weight:600}
@media (max-width:960px){
  .shell{grid-template-columns:1fr;gap:0}
  .ix{position:static;max-height:none;padding:14px 0 0}
  .ix-sub{display:none!important}
}
@media print{ .ix{display:none!important} .shell{display:block;padding:0} }

/* 1 · Estructura patrón de cargos (vino del artefacto «Escalones de la estructura patrón»; todo bajo .ep) */
.ep{--ink:var(--fg);--head:var(--navy);--accent:var(--blue);--accent-soft:var(--soft);
  --warn-soft:color-mix(in srgb,var(--warn) 12%,var(--surface));
  --fs-body:1rem;--fs-small:.875rem;--fs-xs:.78rem;--fs-h1:2rem;--fs-h2:1.4rem;--fs-h3:1.2rem;
  --e1:#E4EDF8; --e1-ink:#1F3864;
  --e2:#CCDDF0; --e2-ink:#1F3864;
  --e3:#ABC9E9; --e3-ink:#13284A;

<section class="hero"><div class="k">Fase 3 · Talento · Grupo Kenex</div><h1>Estructura patrón de cargos</h1><p>Los niveles de cargo de la organización, del operario al director, iguales para todas las áreas. Son atemporales y flexibles: piezas de trabajo con las que se arman las áreas, que no cambian cuando cambia la estructura. Para cada escalón: qué hace, qué tiene que saber, qué resuelve, de qué responde, cuánta experiencia se estima y en qué se distingue del vecino. Es la base de la reclasificación y de las descripciones de cargo (punto 2).</p></section>
<div class="ep">
<p class="aviso"><span><b>Borrador del equipo consultor</b> para revisar con Desarrollo Corporativo. Las denominaciones de los escalones siguen abiertas en las decisiones pendientes de la estructura To-Be, y los ejemplos de Kenex son orientativos: dónde queda cada cargo lo dice la reclasificación, no esta página.</span></p>
<section class="blk" id="escalera">
  <div class="intro">
    <h2>La escalera</h2>
    <p>Del operario al director hay ocho escalones. Son niveles de cargo, y no hay que confundirlos con los niveles de la estructura. La estructura tiene los suyos: lo corporativo, que sirve a todo el grupo, y lo de cada país. La escalera vale en los dos: cuando hace falta, el cargo toma el nivel de la estructura como apellido, según dónde está la posición. Así, un mismo escalón da un Gerente corporativo de Compras o un Gerente país de Administración y Finanzas, un Coordinador corporativo de Formación o un Coordinador país de Servicios Generales. La escalera es atemporal y flexible: sus escalones son piezas de trabajo con las que se arman las áreas, y cada área toma las que necesita. Se leen de abajo arriba, porque cada escalón se define por lo que suma al anterior: más conocimiento, problemas menos previsibles, más años de experiencia y, desde el cuarto, personas a cargo.</p>
  </div>
  <div class="fig-wrap">
    <div class="techo"><span>Por encima: Presidencia y Junta Directiva, fuera del patrón</span></div>
    <div class="escalera" role="img" aria-label="Escalera de ocho escalones: Operario, Auxiliar, Analista I, II y III, Supervisor o Especialista, Coordinador, Gerente de unidad de negocio, Gerente y Director.">
      <div class="pel k1" style="--h:1"><a href="#operario"><span class="pel-n">Operario(a)</span><span class="pel-blk">0 a 1 año<br>nivel OIT 1–2</span></a></div>
      <div class="pel k2" style="--h:2"><a href="#auxiliar"><span class="pel-n">Auxiliar</span><span class="pel-blk">6 meses a 2 años<br>nivel OIT 2</span></a></div>
      <div class="pel k3" style="--h:3"><a href="#analista"><span class="pel-n">Analista <small>I · II · III</small></span><span class="pel-blk"><span class="grados"><span>III</span><span>II</span><span>I</span></span>0 a 6 años<br>nivel OIT 3–4</span></a></div>
      <div class="pel k4 doble" style="--h:4">
        <a href="#supervisor"><span class="pel-n">Supervisor(a)</span><span class="pel-blk">dirige un equipo<br>3 a 5 años</span></a>
        <a href="#especialista"><span class="pel-n">Especialista</span><span class="pel-blk">autoridad en una materia<br>6 a 10 años</span></a>
      </div>
      <div class="pel k5" style="--h:5"><a href="#coordinador"><span class="pel-n">Coordinador(a)</span><span class="pel-blk">dirige un área<br>5 a 8 años</span></a></div>
      <div class="pel k6" style="--h:6"><a href="#gerente-un"><span class="pel-n">Gerente de unidad de negocio</span><span class="pel-blk">un canal o un frente<br>8 a 12 años</span></a></div>
      <div class="pel k8" style="--h:7"><a href="#gerente"><span class="pel-n">Gerente</span><span class="pel-blk">dirige una función<br>10 a 15 años</span></a></div>
      <div class="pel k9" style="--h:8"><a href="#director"><span class="pel-n">Director(a)</span><span class="pel-blk">una gran función<br>más de 15 años</span></a></div>
    </div>
    <div class="suelo"><span class="c7" style="grid-column:1/-1">Escalones de cargo · cada área toma los que necesita</span></div>
  </div>
  <p class="leyenda-fig">Los años son la experiencia relacionada que se estima para ocupar el cargo. El nivel OIT es el nivel de competencias de la Clasificación Internacional Uniforme de Ocupaciones (CIUO-08), de 1 a 4. Supervisor(a) y Especialista comparten escalón: son dos trayectorias del mismo nivel. Cada área toma los escalones que necesita. Toque un escalón para ir a su ficha.</p>
</section>

<section class="blk" id="leer">
  <div class="intro">
    <h2>Cómo leer un escalón</h2>
    <p>Seis ideas ordenan la sección. Las cuatro vienen de los marcos de referencia y coinciden con las premisas que el equipo fijó el 10-nov para desarrollar la capa país.</p>
  </div>
  <div class="principios">
    <div class="pr">
      <h3>Nivel de cargo y nivel de estructura: el apellido</h3>
      <p>La estructura tiene dos niveles: lo corporativo, que sirve a todo el grupo, y lo de cada país. La escalera no los repite: sus escalones valen en los dos. Cuando hace falta, el cargo toma el nivel de la estructura como apellido, según dónde está la posición: Gerente corporativo, Gerente país, Coordinador corporativo. El escalón es el mismo; el apellido dice dónde se ejerce, y el mayor alcance se refleja en el grado.</p>
      <p class="cita">WTW gradúa cada cargo, entre otros factores, por el <q>área de impacto</q>: dónde se siente lo que hace. <a href="#r-wtw">WTW, 2024, p. 18</a></p>
    </div>
    <div class="pr">
      <h3>La escalera es atemporal y flexible</h3>
      <p>Los escalones no dependen de cómo esté armada hoy la estructura. Son piezas de trabajo con las que se arman las áreas: cada área toma las que necesita y, si la estructura cambia, la escalera sigue siendo la misma.</p>
      <p class="cita">WTW dice de su sistema de grados que <q>se puede aplicar a una organización de cualquier tamaño y de cualquier industria</q>. <a href="#r-wtw">WTW, 2024, p. 2</a></p>
    </div>
    <div class="pr">
      <h3>El escalón clasifica el cargo, no a la persona</h3>
      <p>Un escalón dice qué exige el trabajo, no qué títulos o qué antigüedad tiene quien lo ocupa. Por eso la estructura patrón va antes que la reclasificación, y los equipos se arman después de las dos.</p>
      <p class="cita">OIT: <q>la entidad que se clasifica es el empleo, no la persona que lo desempeña</q>. <a href="#r-oit">CIUO-08, p. 14</a>. El método Hay mira la naturaleza y las exigencias del cargo, no la formación ni las características de quien lo ocupa. <a href="#r-uwo">UWO, 2007</a></p>
    </div>
    <div class="pr">
      <h3>Un escalón es un nivel, no un nombre de cargo</h3>
      <p>Cada familia pone el nombre: «Asesor(a) de ventas», «Diseñador(a)» o «Ejecutivo(a) de cuenta» pueden estar en un mismo escalón. Así no se crea un tipo de cargo por cada proceso u ocupante: los escalones son pocos y comunes.</p>
      <p class="cita">WTW ubica primero cada cargo en una banda, según cómo contribuye, y después le asigna el grado con siete factores. <a href="#r-wtw">WTW, 2024, pp. 5–6</a></p>
    </div>
    <div class="pr">
      <h3>Tres preguntas: saber, resolver, responder</h3>
      <p>Cada ficha responde qué hay que saber, qué tipo de problema hay que resolver y de qué resultado se responde. A esas tres se suma la experiencia estimada: cuántos años de práctica relacionada suele tener quien ocupa el cargo.</p>
      <p class="cita">Hay: <q>el conocimiento que se requiere para resolver el problema y entregar el resultado del que el cargo responde</q>. <a href="#r-hay">Hay, 2014, p. 1</a>. La SVP mide la experiencia como el tiempo que un trabajador típico necesita para <q>alcanzar un desempeño promedio</q> en el cargo. <a href="#r-svp">DOL</a></p>
    </div>
    <div class="pr">
      <h3>Desde el cuarto escalón, dos caminos</h3>
      <p>Se puede subir dirigiendo personas o profundizando en una materia. Las dos trayectorias tienen el mismo nivel, para que nadie tenga que dejar su especialidad y asumir un equipo solo para subir.</p>
      <p class="cita">El árbol de bandas de WTW separa la trayectoria de gestión de la de contribución individual con la pregunta <q>¿gestionar personas es el foco?</q> <a href="#r-wtw">WTW, 2024, p. 17</a></p>
    </div>
  </div>
</section>

<section class="blk" id="equipos" aria-labelledby="t-fichas">
  <div class="intro">
    <h2 id="t-fichas">Del operario al coordinador</h2>
    <p>De abajo arriba. Cada ficha cierra con lo que distingue al escalón de su vecino, ejemplos orientativos de Kenex y las fuentes que la sostienen.</p>
  </div>

  <div class="fichas">

    <!-- OPERARIO -->
    <article class="esc" id="operario">
      <div class="esc-lado">
        <div class="eyebrow">Base de la escalera</div>
        <div class="esc-tit"><span class="sw k1" aria-hidden="true"></span><h3>Operario(a)</h3></div>
        <p class="prop">Hace el trabajo físico de la operación con métodos ya definidos: recibe, mueve, almacena, prepara, instala, mantiene o entrega.</p>
        <dl class="meta">
          <dt>Experiencia</dt><dd>0 a 1 año</dd>
          <dt>Personas a cargo</dt><dd>Ninguna</dd>
          <dt>Nivel OIT</dt><dd>1 a 2</dd>
        </dl>
      </div>
      <div class="esc-cuerpo">
        <div class="hay">
          <div><h4>Saber</h4><p>Un oficio que se aprende en el puesto o con formación técnica corta. Manejo seguro de equipos y herramientas, y lectura de instrucciones, etiquetas y órdenes de trabajo.</p></div>
          <div><h4>Resolver</h4><p>Sigue el procedimiento. Ante lo que no encaja, como mercancía dañada, una diferencia de conteo o un equipo que falla, se detiene y avisa: no decide la excepción.</p></div>
          <div><h4>Responder</h4><p>Por la tarea bien hecha, a tiempo y sin accidentes. El resultado se ve al cerrar el turno.</p></div>
        </div>
        <p class="par"><b>Se distingue del auxiliar</b> en el objeto del trabajo: el operario actúa sobre cosas (mercancía, equipos, espacios) y el auxiliar sobre información (documentos, registros, solicitudes). Cuando un cargo combina las dos, se clasifica por la tarea que exige más, siempre que sea parte estable del cargo y no algo ocasional.</p>
        <p class="par"><b>En Kenex, por ejemplo:</b> recepción, almacenamiento y despacho en bodega; mantenimiento de sedes, tiendas y bodegas en Servicios Generales; montaje de exhibiciones en tienda.</p>
        <p class="fuentes">Fuentes: la OIT describe el nivel 1 como <q>tareas físicas o manuales simples y rutinarias</q> y pone en el nivel 2 operar maquinaria y conducir vehículos (<a href="#r-oit">CIUO-08, pp. 12–13</a>). WTW, banda 1 «Manual» (<a href="#r-wtw">2024, p. 12</a>). Experiencia: SVP 2 a 5, de un mes a un año (<a href="#r-svp">DOL</a>), y O*NET, zonas 1–2, de unos días a un año de entrenamiento en el puesto (<a href="#r-onet">Job Zones</a>). Mintzberg lo ubica en el núcleo de operaciones, que produce los bienes y servicios (<a href="#r-mintzberg">1979</a>).</p>
      </div>
    </article>

    <!-- AUXILIAR -->
    <article class="esc" id="auxiliar">
      <div class="esc-lado">
        <div class="eyebrow">Sostiene el proceso</div>
        <div class="esc-tit"><span class="sw k2" aria-hidden="true"></span><h3>Auxiliar</h3></div>
        <p class="prop">Sostiene el proceso con el registro, el trámite y la atención: carga y verifica datos, emite y archiva documentos, atiende solicitudes y sigue lo pendiente.</p>
        <dl class="meta">
          <dt>Experiencia</dt><dd>6 meses a 2 años</dd>
          <dt>Personas a cargo</dt><dd>Ninguna</dd>
          <dt>Nivel OIT</dt><dd>2</dd>
        </dl>
      </div>
      <div class="esc-cuerpo">
        <div class="hay">
          <div><h4>Saber</h4><p>Secundaria completa y, a menudo, formación técnica corta. Manejo de los sistemas del proceso (Odoo, Lark), redacción clara y cálculos sencillos.</p></div>
          <div><h4>Resolver</h4><p>Aplica reglas conocidas y resuelve las variaciones que ya tienen respuesta. Lo que no está en la regla lo pasa al analista o al supervisor, con el caso documentado.</p></div>
          <div><h4>Responder</h4><p>Por que el dato y el documento estén completos, correctos y a tiempo, porque de ellos depende el paso siguiente del proceso.</p></div>
        </div>
        <p class="par"><b>Se distingue del analista</b> en que registra y tramita según la regla, mientras el analista interpreta la información, encuentra la causa y propone. <b>Del operario</b>, en que trabaja sobre información y no sobre cosas.</p>
        <p class="par"><b>En Kenex, por ejemplo:</b> apoyo administrativo en compras, cuentas por pagar y por cobrar, y documentación de despacho. La atención al cliente en tienda está en el mismo nivel de competencias según la OIT; si se nombra «Asesor(a)» dentro de este escalón es una de las decisiones abiertas.</p>
        <p class="fuentes">Fuentes: para el nivel 2, la OIT exige <q>leer información como instrucciones de seguridad, llevar registros escritos del trabajo realizado y hacer con exactitud cálculos aritméticos simples</q>, y pone allí al personal de apoyo administrativo (gran grupo 4) y a los vendedores de tienda (gran grupo 5) (<a href="#r-oit">CIUO-08, pp. 12 y 14</a>). WTW, banda 2 «Clerical/Administrative» (<a href="#r-wtw">2024, p. 12</a>). O*NET, zonas 1–2: de unos días a un año de entrenamiento en el puesto (<a href="#r-onet">Job Zones</a>). Experiencia: SVP 4 a 6, de tres meses a dos años (<a href="#r-svp">DOL</a>).</p>
      </div>
    </article>

    <!-- ANALISTA -->
    <article class="esc" id="analista">
      <div class="esc-lado">
        <div class="eyebrow">Primer escalón profesional</div>
        <div class="esc-tit"><span class="sw k3" aria-hidden="true"></span><h3>Analista I · II · III</h3></div>
        <p class="prop">Convierte información en análisis, propuestas y control dentro de una especialidad: concilia, calcula, proyecta, diagnostica, diseña y reporta.</p>
        <dl class="meta">
          <dt>Experiencia</dt><dd>I: 0 a 2 · II: 2 a 4 · III: 4 a 6 años</dd>
          <dt>Personas a cargo</dt><dd>Ninguna formal</dd>
          <dt>Nivel OIT</dt><dd>3 a 4</dd>
        </dl>
      </div>
      <div class="esc-cuerpo">
        <div class="hay">
          <div><h4>Saber</h4><p>Formación técnica superior o universitaria en la especialidad, más el conocimiento del negocio que da la práctica. Es el primer escalón donde la teoría de una disciplina es requisito.</p></div>
          <div><h4>Resolver</h4><p>Problemas que no traen la respuesta escrita: elige el método, cruza fuentes, explica una desviación y propone qué hacer.</p></div>
          <div><h4>Responder</h4><p>Por la calidad del análisis y por su uso: que la cifra sea confiable, que la recomendación se sostenga y que llegue a tiempo para decidir.</p></div>
        </div>
        <p class="par">Los tres grados hacen el mismo tipo de trabajo. Cambia cuánta guía necesitan y qué tan nuevos son los casos que resuelven.</p>
        <div class="grados-tab">
          <div><b>Analista I · entrada · 0 a 2 años</b><p>Aplica métodos establecidos a problemas definidos. Su trabajo se revisa paso a paso. Está aprendiendo la especialidad y el negocio.</p></div>
          <div><b>Analista II · pleno · 2 a 4 años</b><p>Trabaja con independencia en los casos habituales de su área. Se le revisa el resultado, no cada paso. Puede guiar a un analista I en el día a día.</p></div>
          <div><b>Analista III · referencia · 4 a 6 años</b><p>Resuelve los casos no rutinarios y propone mejoras al método. Es la referencia técnica de su equipo y revisa el trabajo de otros, sin tener personas a cargo.</p></div>
        </div>
        <p class="par"><b>Se distingue del auxiliar</b> en que interpreta y propone. <b>Del especialista</b>, en el alcance: el analista III es referencia en su equipo; el especialista lo es para toda la organización en una materia y responde por el criterio que otros aplican.</p>
        <p class="par"><b>En Kenex, por ejemplo:</b> planificación de compras e inventario, precios, cuentas por cobrar y conciliaciones, inteligencia de negocio, diseño gráfico y ejecutivos de cuenta en el mayor. Según dónde trabaje, el analista está en el núcleo de operaciones o en lo que Mintzberg llama tecnoestructura: quienes diseñan los planes, estándares y controles con que trabajan los demás.</p>
        <p class="fuentes">Fuentes: OIT, nivel 3 (<q>tareas técnicas y prácticas complejas</q> que requieren amplio conocimiento técnico y de procedimiento) y nivel 4 (<q>resolución de problemas complejos, toma de decisiones y creatividad</q> sobre conocimiento teórico), grandes grupos 3 y 2 (<a href="#r-oit">CIUO-08, p. 13</a>). WTW, banda 3IC «Professional»: su árbol pregunta si el cargo tiene <q>independencia para aplicar el conocimiento profesional</q> (<a href="#r-wtw">2024, p. 17</a>). O*NET, zonas 3–4 (<a href="#r-onet">Job Zones</a>). Experiencia: SVP 7 a 8, de 2 a 10 años de preparación contando la formación específica (<a href="#r-svp">DOL</a>). Katz: en los escalones de base pesa sobre todo la habilidad técnica (<a href="#r-katz">1955</a>). Mintzberg, tecnoestructura (<a href="#r-mintzberg">1979</a>).</p>
      </div>
    </article>

    <!-- SUPERVISOR / ESPECIALISTA -->
    <article class="esc" id="supervisor">
      <div class="esc-lado">
        <div class="eyebrow">Mismo escalón, dos trayectorias</div>
        <div class="esc-tit"><span class="sw k4" aria-hidden="true"></span><h3>Supervisor(a) / Especialista</h3></div>
        <p class="prop">Aquí el patrón abre dos caminos del mismo nivel. La diferencia no es de tamaño sino de cómo contribuye el cargo: dirigiendo a otros o siendo la autoridad en una materia.</p>
        <dl class="meta">
          <dt>Experiencia</dt><dd>Supervisor: 3 a 5 años · Especialista: 6 a 10</dd>
          <dt>Nivel OIT</dt><dd>2–3 (supervisor) · 4 (especialista)</dd>
        </dl>
      </div>
      <div class="esc-cuerpo">
        <div class="dos">
          <div class="via">
            <h4>Supervisor(a)</h4>
            <p>Primera línea de mando. Organiza el trabajo de un turno, una tienda, una cuadrilla o un equipo operativo, y hace que salga como se planificó.</p>
            <dl>
              <dt>Saber</dt><dd>El oficio que supervisa, bien aprendido (suele venir de él), y lo que el oficio no enseña: programar, delegar, enseñar en el puesto, dar retroalimentación y manejar conflictos.</dd>
              <dt>Resolver</dt><dd>Reparte tareas y turnos, reasigna cuando falta alguien, resuelve las incidencias del día y decide qué escala. Ajusta el cómo; el qué y el cuánto los fija el coordinador.</dd>
              <dt>Responder</dt><dd>Por el cumplimiento, la calidad y la seguridad del trabajo de su equipo en el periodo. No por el presupuesto ni por la unidad completa.</dd>
              <dt>Personas a cargo</dt><dd>Sí: operarios, auxiliares o analistas de un mismo proceso.</dd>
            </dl>
          </div>
          <div class="via" id="especialista">
            <h4>Especialista</h4>
            <p>Autoridad técnica de la organización en una materia crítica. Fija el criterio que otros aplican, resuelve los casos más difíciles y representa la materia ante terceros.</p>
            <dl>
              <dt>Saber</dt><dd>Dominio profundo y al día de la materia, normalmente con grado o posgrado y varios años de práctica, y de cómo esa materia toca el negocio.</dd>
              <dt>Resolver</dt><dd>Los casos que un analista III no puede cerrar, y la pregunta de cómo debe hacerse: escribe la norma técnica, el método o el estándar.</dd>
              <dt>Responder</dt><dd>Por la solidez del criterio que la organización usa en su materia y por sus consecuencias.</dd>
              <dt>Personas a cargo</dt><dd>No, o solo de forma funcional dentro de un proyecto.</dd>
            </dl>
          </div>
        </div>
        <p class="par"><b>Se distinguen</b> en de qué responden: el supervisor, de lo que hace su equipo; el especialista, del criterio con que trabaja la organización en su materia. Ninguna de las dos es paso obligado hacia la otra. <b>Del analista III</b>, el supervisor se distingue por tener personas a cargo y el especialista por su alcance, que es toda la organización y no un equipo.</p>
        <div class="criterio">
          <b>Cuándo abrir un cargo de Especialista</b>
          <ol>
            <li>La materia es crítica para el negocio o para el cumplimiento.</li>
            <li>Hace falta una referencia para todo el grupo, no para un equipo.</li>
            <li>Su criterio se puede describir y evaluar.</li>
          </ol>
          <span>Si falta alguna de las tres, el cargo es Analista III. El especialista no es una salida para subir de nivel a quien no tiene equipo.</span>
        </div>
        <p class="par"><b>En Kenex, por ejemplo:</b> supervisión de turno en bodega y despacho, de tienda o de un equipo de atención; especialistas en comercio exterior y aduanas, datos maestros y catálogo, garantías o la configuración funcional de Odoo.</p>
        <p class="fuentes">Fuentes: para la OIT, la diferencia crítica es que <q>los supervisores responden solo de supervisar las actividades de otros trabajadores</q>, mientras los gerentes tienen la responsabilidad general de una unidad; además, crea grupos propios de supervisores solo donde sus tareas difieren de las de los supervisados, como oficina (3341), tienda (5222) y manufactura (3122) (<a href="#r-oit">CIUO-08, pp. 24–25 y 40</a>). Experiencia: SVP 7 a 8; la escala cuenta como preparación <q>la experiencia en cargos de menor responsabilidad que conducen</q> al cargo, que es de donde suele venir un supervisor (<a href="#r-svp">DOL</a>). Charan, Drotter y Noel: es la primera transición, pasar de producir resultados uno mismo a producirlos a través de otros (<a href="#r-pipeline">2001</a>). WTW, bandas 3M «Supervisor» y 4IC «Subject Matter Expert» (<a href="#r-wtw">2024, pp. 12 y 17</a>). Allen y Katz sobre la doble escalera (<a href="#r-allen">1986</a>).</p>
      </div>
    </article>

    <!-- COORDINADOR -->
    <article class="esc" id="coordinador">
      <div class="esc-lado">
        <div class="eyebrow">Dirige un área</div>
        <div class="esc-tit"><span class="sw k5" aria-hidden="true"></span><h3>Coordinador(a)</h3></div>
        <p class="prop">Responde por un área de trabajo completa dentro de una gerencia: sus resultados, sus recursos y su gente. Es el primer escalón que dirige una unidad y no solo un equipo.</p>
        <dl class="meta">
          <dt>Experiencia</dt><dd>5 a 8 años, 1 o 2 conduciendo equipos</dd>
          <dt>Personas a cargo</dt><dd>Sí, directas o a través de supervisores</dd>
          <dt>Nivel OIT</dt><dd>3 a 4, en el gran grupo 1 si dirige la unidad</dd>
        </dl>
      </div>
      <div class="esc-cuerpo">
        <div class="hay">
          <div><h4>Saber</h4><p>La especialidad del área y la gestión: planificación, presupuesto del área, indicadores, selección y evaluación de personas, y mejora de procedimientos.</p></div>
          <div><h4>Resolver</h4><p>Prioriza entre demandas que compiten, asigna recursos, rehace el procedimiento cuando no funciona y negocia con otras áreas. Propone cambios de política, pero no los aprueba.</p></div>
          <div><h4>Responder</h4><p>Por los indicadores del área en el año, por el uso de sus recursos y por el desarrollo de su gente. Rinde cuentas a su gerente o a su director.</p></div>
        </div>
        <p class="par"><b>Se distingue del supervisor</b> en el alcance: el supervisor responde por la ejecución de un equipo en el periodo; el coordinador, por la unidad entera, con presupuesto, indicadores y personas. <b>Del gerente</b>, en que no fija la política de la función ni la representa. Si le reportan supervisores, dirige a quienes dirigen, que es la segunda transición de Charan, Drotter y Noel.</p>
        <p class="par"><b>Apellido.</b> Según dónde esté la posición, el cargo se llama coordinador país o coordinador corporativo: es el mismo escalón.</p>
        <p class="par"><b>En Kenex, por ejemplo:</b> las coordinaciones que la estructura To-Be ya dibuja. Con apellido país: Servicios Generales, las cinco de Mercadeo, Compras Internas y Tecnología. Con apellido corporativo: Compras Casio; Compras Cubitt; Planificación, Despacho e Inventarios; Despacho; las dos de Diseño y Marca; Planificación y Control Financiero; y Formación. De forma orientativa, también la coordinación de una tienda.</p>
        <p class="fuentes">Fuentes: OIT: los gerentes tienen <q>la responsabilidad general de las operaciones de una empresa o de una unidad organizativa</q>, y gerentes y supervisores por igual <q>planifican, organizan, coordinan, controlan y dirigen el trabajo de otros</q> (<a href="#r-oit">CIUO-08, p. 40</a>). Mintzberg: es la base de la línea media, entre la cúpula y el núcleo de operaciones (<a href="#r-mintzberg">1979</a>). Katz: a medida que se sube, la habilidad humana se mantiene y crece la conceptual (<a href="#r-katz">1955</a>). WTW, entre las bandas 3M «Supervisor» y 4M «Middle Management» (<a href="#r-wtw">2024, p. 12</a>). Experiencia: SVP 8, de más de 4 a 10 años (<a href="#r-svp">DOL</a>). Charan, Drotter y Noel (<a href="#r-pipeline">2001</a>).</p>
      </div>
    </article>

  </div>
</section>

<section class="blk" id="direccion" aria-labelledby="t-dir">
  <div class="intro sec-sub">
    <h2 id="t-dir">Gerentes y director</h2>
    <p>Los tres escalones de dirección. Del coordinador al gerente de unidad de negocio, de este al gerente y del gerente al director lo que sube ya no es el conocimiento técnico sino el alcance: un canal o un frente, una función, una gran función con varias funciones. Dónde se ejerce, en un país o para todo el grupo, es el apellido que pone la estructura.</p>
    <p>Un aviso sobre las fuentes: la OIT clasifica a todos los gerentes en su gran grupo 1, por la función que dirigen (finanzas, ventas, abastecimiento, comercio), y no distingue niveles jerárquicos entre ellos. En estas fichas la OIT describe la naturaleza del cargo; el nivel lo dan Charan, Drotter y Noel, y WTW, y la experiencia, la escala SVP.</p>
  </div>

  <div class="fichas">

    <!-- GERENTE DE UNIDAD DE NEGOCIO -->
    <article class="esc" id="gerente-un">
      <div class="esc-lado">
        <div class="eyebrow">Lleva un canal o un frente</div>
        <div class="esc-tit"><span class="sw k6" aria-hidden="true"></span><h3>Gerente de unidad de negocio</h3></div>
        <p class="prop">Lleva un canal de venta o un frente de mercadeo para todo el grupo, dentro de una gerencia: define cómo se trabaja ese canal en todos los países y responde por su resultado consolidado.</p>
        <dl class="meta">
          <dt>Experiencia</dt><dd>8 a 12 años, con el canal en más de un país</dd>
          <dt>Personas a cargo</dt><dd>Quienes llevan el canal en cada país, o un equipo propio</dd>
          <dt>Nivel OIT</dt><dd>4, unidad 1221</dd>
        </dl>
      </div>
      <div class="esc-cuerpo">
        <div class="hay">
          <div><h4>Saber</h4><p>El canal o el frente a fondo y en varios mercados: su modelo de negocio, su cliente, sus márgenes, su operación y lo que hace la competencia.</p></div>
          <div><h4>Resolver</h4><p>Fija los estándares del canal para todos los países, ordena sus prioridades, arbitra entre países del mismo canal y propone a su gerente dónde invertir.</p></div>
          <div><h4>Responder</h4><p>Por el resultado consolidado del canal en el grupo (venta, margen, servicio) o del frente de mercadeo, y por que el canal funcione igual en todos los países.</p></div>
        </div>
        <p class="par"><b>Se distingue del coordinador</b> en que lleva un canal o un frente completo, en todos los países, y no un área. <b>Del gerente</b>, en que no lleva toda la función (Ventas o Mercadeo, por ejemplo) sino un canal o un frente dentro de ella. Se usa donde hay un canal o un frente que llevar igual en todos los países.</p>
        <p class="par"><b>En Kenex, por ejemplo:</b> en Ventas, Ventas al Mayor, Retail, E-commerce y Growth, Postventa, y Planificación de la Demanda y Nuevos Mercados como apoyo. En Mercadeo, Insights y ROI, Social y Contenido, Cuentas Clave y Trade, y Visual Merchandising.</p>
        <p class="fuentes">Fuentes: experiencia, SVP 8 a 9 (<a href="#r-svp">DOL</a>). Jaques, con su regla de que cada capa resuelve lo que la de abajo no puede: aquí, que el canal sea uno solo en todos los países, algo que ninguna gerencia país puede asegurar sola (<a href="#r-go">GO Society</a>). La OIT describe a los gerentes de ventas y mercadeo como quienes <q>planifican, dirigen y coordinan las actividades de ventas y mercadeo</q>, incluidas las listas de precios, los descuentos y las campañas (unidad 1221, nivel 4) (<a href="#r-oit">CIUO-08, p. 95</a>). WTW, banda 4M (<a href="#r-wtw">2024, p. 12</a>).</p>
      </div>
    </article>

    <!-- GERENTE -->
    <article class="esc" id="gerente">
      <div class="esc-lado">
        <div class="eyebrow">Dirige una función</div>
        <div class="esc-tit"><span class="sw k8" aria-hidden="true"></span><h3>Gerente</h3></div>
        <p class="prop">Dirige una función o un conjunto de áreas: convierte la línea que le da su dirección en la política y los planes de la función, conduce a los coordinadores que la ejecutan y responde por su resultado.</p>
        <dl class="meta">
          <dt>Experiencia</dt><dd>10 a 15 años, 5 o más dirigiendo áreas</dd>
          <dt>Personas a cargo</dt><dd>Gerentes de unidad de negocio y coordinadores</dd>
          <dt>Nivel OIT</dt><dd>3 a 4, gran grupo 1</dd>
        </dl>
      </div>
      <div class="esc-cuerpo">
        <div class="hay">
          <div><h4>Saber</h4><p>La función completa y cómo toca a las demás: qué necesita de ellas y qué les entrega. Gestión de presupuesto, de indicadores y de equipos de varios niveles, y el marco normativo en que opera la función.</p></div>
          <div><h4>Resolver</h4><p>Decide la política y los procesos de su función dentro de la línea de su dirección, reparte recursos y personas entre sus áreas, arbitra entre ellas y lleva a su dirección o al comité lo que cruza con otras funciones.</p></div>
          <div><h4>Responder</h4><p>Por los indicadores de la función en el año, su presupuesto, el cumplimiento de las normas que la rigen y la formación de sus coordinadores.</p></div>
        </div>
        <p class="par"><b>Se distingue del gerente de unidad de negocio</b> en que lleva la función completa y no un canal o un frente dentro de ella; <b>del coordinador</b>, en que dirige varias áreas y responde por la función con su presupuesto. <b>Del director</b>, en que lleva una función y no una gran función con varias, y no fija la línea rectora. Es la segunda y la tercera transición de Charan, Drotter y Noel: dirigir a quienes dirigen y, después, dirigir una función, que obliga a valorar funciones que uno nunca ejerció.</p>
        <p class="par"><b>Apellido.</b> Un gerente puede llevar su función en un país o para todo el grupo. El escalón es el mismo; cuando hace falta, el cargo toma el apellido de la estructura, como Gerente país de Administración y Finanzas o Gerente corporativo de Compras, y el mayor alcance se refleja en el grado, como hace WTW con su factor «área de impacto». Por eso la experiencia va de 10 a 15 años: el extremo alto corresponde a los alcances mayores.</p>
        <p class="par"><b>En Kenex, por ejemplo:</b> con apellido país, las gerencias de Operaciones y Logística, Retail, E-commerce, Postventa, Mercadeo, Administración y Finanzas, y Recursos Humanos; con apellido corporativo, Ventas, Mercadeo, Brand Management, Compras, Operaciones y Logística, PMO, Gobierno de IA y Tecnología, Gobernanza del Dato y Cumplimiento.</p>
        <p class="fuentes">Fuentes: la OIT describe a los gerentes de servicios administrativos y comerciales como quienes <q>formulan y administran la asesoría de políticas y la planificación estratégica y financiera</q> (subgrupo 12, nivel 4), a los de ventas y mercadeo como quienes <q>planifican, dirigen y coordinan las actividades de ventas y mercadeo</q> (unidad 1221) y a los de comercio al por menor como responsables de <q>los presupuestos, la dotación de personal y la dirección estratégica y operativa</q> (unidad 1420, nivel 3) (<a href="#r-oit">CIUO-08, pp. 92, 95 y 107</a>). Charan, Drotter y Noel, segunda y tercera transición (<a href="#r-pipeline">2001</a>). WTW, banda 4M «Middle Management», y 5BS cuando influye en la estrategia (<a href="#r-wtw">2024, pp. 12 y 17</a>). Experiencia: SVP 9, más de 10 años (<a href="#r-svp">DOL</a>); O*NET pone a los gerentes de ventas en la zona 4, que pide <q>varios años</q> de experiencia relacionada (<a href="#r-onet">Job Zones</a>). Mintzberg: línea media (<a href="#r-mintzberg">1979</a>).</p>
      </div>
    </article>

    <!-- DIRECTOR -->
    <article class="esc" id="director">
      <div class="esc-lado">
        <div class="eyebrow">Fija la línea rectora</div>
        <div class="esc-tit"><span class="sw k9" aria-hidden="true"></span><h3>Director(a)</h3></div>
        <p class="prop">Conduce una gran función del grupo y fija su línea rectora: hacia dónde va, con qué prioridades, recursos e indicadores. Su operatividad es baja: verifica y orienta.</p>
        <dl class="meta">
          <dt>Experiencia</dt><dd>Más de 15 años, 5 o más en dirección</dd>
          <dt>Personas a cargo</dt><dd>Gerentes</dd>
          <dt>Reporta a</dt><dd>La Presidencia; integra el Comité Directivo</dd>
        </dl>
      </div>
      <div class="esc-cuerpo">
        <div class="hay">
          <div><h4>Saber</h4><p>El negocio completo y su industria, las finanzas del negocio y cómo se integran las especialidades de su función entre sí y con las demás direcciones.</p></div>
          <div><h4>Resolver</h4><p>La estrategia de su función dentro de la del grupo: reparte el presupuesto entre sus gerencias, arbitra entre ellas, decide con sus pares en los comités lo que cruza direcciones y propone a la Presidencia y a la Junta.</p></div>
          <div><h4>Responder</h4><p>Por el resultado de su gran función ante la Presidencia y por los indicadores que la Junta recibe de las direcciones; también por el desarrollo y la sucesión de sus gerentes.</p></div>
        </div>
        <p class="par"><b>Se distingue del gerente</b> en que integra varias funciones y fija la dirección, en vez de llevar una. <b>De la Presidencia</b>, en que conduce una función y no el grupo. Jaques lo dice así: el director tiene que dejar el trabajo de los gerentes que le reportan y diseñar los sistemas con que ellos trabajan. En la estructura To-Be, eso es la <b>baja operatividad</b> que se le pide a las direcciones.</p>
        <p class="par"><b>En Kenex:</b> seis direcciones, todas con apellido corporativo. Cuatro de negocio, en el orden de la cadena de valor: Innovación y Desarrollo de Productos, Diseño y Marca, Compras y Cadena de Suministro, y Comercial. Dos de apoyo: Finanzas y Desarrollo Corporativo. Comercial y Compras y Cadena de Suministro las codirigen dos familiares, cada uno en la subdivisión de la que es especialista; es una excepción que solo se admite entre familiares y en este escalón, y debajo cada gerencia conserva una sola línea de mando. Si la primera línea se llama Dirección o Vicepresidencia es una decisión pendiente de la estructura.</p>
        <p class="fuentes">Fuentes: experiencia, SVP 9, más de 10 años (<a href="#r-svp">DOL</a>). Lee, sobre Jaques: <q>los directores deben dejar de hacer el trabajo</q> del nivel de abajo (<a href="#r-lee">Lee, 2017</a>). La OIT dice que el máximo ejecutivo dirige <q>con el apoyo de otros gerentes</q>, dentro de las pautas de un directorio ante el que responde (unidad 1120); esos gerentes son este escalón (<a href="#r-oit">CIUO-08, p. 91</a>). Charan, Drotter y Noel, cuarta transición: de la función al negocio (<a href="#r-pipeline">2001</a>). WTW, banda 5BS, que su árbol asigna a quien <q>fija o influye significativamente en la estrategia del negocio</q> (<a href="#r-wtw">2024, p. 17</a>). Katz: en la cima pesa sobre todo la habilidad conceptual (<a href="#r-katz">1955</a>). Mintzberg: con la Presidencia, la cúpula estratégica (<a href="#r-mintzberg">1979</a>).</p>
      </div>
    </article>

  </div>
</section>

<section class="blk" id="equivalencias">
  <div class="intro">
    <h2>Equivalencias con los marcos de referencia</h2>
    <p>La misma escalera leída con cada marco. Sirve para dos cosas: comparar los cargos de Kenex con las encuestas salariales del mercado, que usan bandas como las de WTW, y discutir la reclasificación con un lenguaje común.</p>
  </div>
  <div class="tabla-wrap">
    <table>
      <thead><tr><th scope="col">Escalón</th><th scope="col">Experiencia estimada · SVP</th><th scope="col">CIUO-08 · OIT</th><th scope="col">Banda · WTW</th><th scope="col">Zona · O*NET</th></tr></thead>
      <tbody>
        <tr><th scope="row">Director(a)</th><td>Más de 15 años<span class="mut">SVP 9</span></td><td>Gran grupo 1, subgrupos 12 y 13<span class="mut">nivel 4</span></td><td>5BS Top Management</td><td class="num">4–5</td></tr>
        <tr><th scope="row">Gerente</th><td>10 a 15 años<span class="mut">SVP 9</span></td><td>Gran grupo 1, según la función (subgrupos 12 a 14)<span class="mut">niveles 3–4</span></td><td>4M Middle Management; 5BS si influye en la estrategia</td><td class="num">4</td></tr>
        <tr><th scope="row">Gerente de unidad de negocio</th><td>8 a 12 años<span class="mut">SVP 8 a 9</span></td><td>Unidad 1221, ventas y mercadeo<span class="mut">nivel 4</span></td><td>4M Middle Management</td><td class="num">4</td></tr>
        <tr><th scope="row">Coordinador(a)</th><td>5 a 8 años<span class="mut">SVP 8</span></td><td>Gran grupo 1 si dirige la unidad<span class="mut">niveles 3–4</span></td><td>3M Supervisor a 4M Middle Management</td><td class="num">4</td></tr>
        <tr><th scope="row">Supervisor(a)</th><td>3 a 5 años<span class="mut">SVP 7 a 8</span></td><td>Grupos de supervisión (3341, 5222, 3122) o el de los supervisados<span class="mut">niveles 2–3</span></td><td>3M Supervisor</td><td class="num">3–4</td></tr>
        <tr><th scope="row">Especialista</th><td>6 a 10 años<span class="mut">SVP 8</span></td><td>Gran grupo 2, profesionales<span class="mut">nivel 4</span></td><td>4IC Subject Matter Expert</td><td class="num">4–5</td></tr>
        <tr><th scope="row">Analista III</th><td>4 a 6 años<span class="mut">SVP 8</span></td><td>Grandes grupos 2 y 3<span class="mut">niveles 3–4</span></td><td>3IC Professional, grado alto</td><td class="num">4</td></tr>
        <tr><th scope="row">Analista II</th><td>2 a 4 años<span class="mut">SVP 7 a 8</span></td><td>Grandes grupos 2 y 3<span class="mut">niveles 3–4</span></td><td>3IC Professional</td><td class="num">4</td></tr>
        <tr><th scope="row">Analista I</th><td>0 a 2 años después del título<span class="mut">SVP 7</span></td><td>Gran grupo 3, técnicos<span class="mut">nivel 3</span></td><td>3IC Professional, entrada</td><td class="num">3–4</td></tr>
        <tr><th scope="row">Auxiliar</th><td>6 meses a 2 años<span class="mut">SVP 4 a 6</span></td><td>Grandes grupos 4 y 5<span class="mut">nivel 2</span></td><td>2 Clerical/Administrative</td><td class="num">1–2</td></tr>
        <tr><th scope="row">Operario(a)</th><td>0 a 1 año<span class="mut">SVP 2 a 5</span></td><td>Grandes grupos 7, 8 y 9<span class="mut">niveles 1–2</span></td><td>1 Manual</td><td class="num">1–2</td></tr>
      </tbody>
    </table>
  </div>
  <p class="nota-tabla">Son equivalencias orientativas, para conversar. En la OIT, los tres escalones de dirección caen en el mismo gran grupo 1, porque clasifica por función y no por jerarquía. Ninguna equivalencia sustituye la evaluación del cargo: la SVP estima el tiempo típico de preparación, no el de una persona concreta; en la OIT se clasifica por las tareas principales y en WTW la banda sale de un árbol de decisión y el grado de siete factores (conocimiento funcional, conocimiento del negocio, liderazgo, solución de problemas, naturaleza del impacto, área de impacto y habilidades interpersonales).</p>
</section>

<section class="blk" id="reglas">
  <div class="intro">
    <h2>Reglas de diseño que se desprenden</h2>
    <p>Lo que dicen los marcos sobre cómo usar la escalera. Cada regla va con la premisa de Kenex que refuerza.</p>
  </div>
  <div class="reglas">
    <div class="regla">
      <div class="que"><h3>Un escalón de mando solo existe si resuelve lo que el de abajo no puede</h3><p class="cita">Jaques: <q>cada capa superior debe poder resolver los problemas de trabajo que la capa inferior no puede resolver</q>. <a href="#r-go">GO Society, FAQ</a></p></div>
      <p>Un coordinador sobre un supervisor sobre un equipo solo se justifica si el coordinador resuelve lo que el supervisor no puede: planificar el área, su presupuesto y sus indicadores del año. Si los dos hacen lo mismo, repartir y vigilar el trabajo del día, sobra uno. En las áreas pequeñas basta uno de los dos. Refuerza la <b>premisa 1</b>: no crecer a lo alto.</p>
    </div>
    <div class="regla">
      <div class="que"><h3>Contar los niveles de mando de cada línea</h3><p class="cita">Es la misma regla de Jaques aplicada a una línea entera: cada escalón de mando tiene que agregar algo que el de abajo no puede resolver. <a href="#r-go">GO Society, FAQ</a></p></div>
      <p>La línea más larga es Comercial: Presidencia, Dirección Comercial, Ventas, Retail, Retail país y, debajo, la coordinación y la supervisión de tienda. Son siete niveles de mando antes de llegar al asesor; en Operaciones y Logística, con el mismo tipo de trabajo, son cinco. Para que cada uno se justifique, cada uno tiene que decidir algo distinto. Esa es la línea a revisar primero, como ya advierte la estructura al decir que las gerencias de unidad de negocio añaden un escalón en Comercial. Refuerza la <b>premisa 1</b>.</p>
    </div>
    <div class="regla">
      <div class="que"><h3>El escalón lo da el alcance, no a quién se reporta</h3><p class="cita">WTW gradúa cada cargo por siete factores, entre ellos la naturaleza y el área de su impacto, no por su línea de reporte. <a href="#r-wtw">WTW, 2024, p. 18</a></p></div>
      <p>Las gerencias de PMO, Gobierno de IA y Tecnología, Gobernanza del Dato y Cumplimiento reportan a la Presidencia, y las de Administración y Finanzas de cada país, a la Dirección de Finanzas: en todos los casos el escalón es gerente. Reportar más arriba no sube el escalón; lo que cambia es el apellido, corporativo o país, y el alcance se refleja en el grado.</p>
    </div>
    <div class="regla">
      <div class="que"><h3>Nadie del equipo por encima de su jefe</h3><p class="cita">Hay llama <i>sorethumbing</i> a revisar las anomalías, como <q>un miembro del equipo evaluado al mismo nivel o por encima de su jefe</q>. <a href="#r-hay">Hay, 2014</a></p></div>
      <p>Un especialista no reporta a un supervisor: su criterio vale para toda la organización y su escalón es el mismo. Reporta al coordinador o al gerente. Lo mismo vale para un analista III bajo un supervisor de su mismo proceso: hay que mirar si el supervisor está bien nivelado.</p>
    </div>
    <div class="regla">
      <div class="que"><h3>La trayectoria técnica tiene que valer lo mismo</h3><p class="cita">Allen y Katz estudiaron la doble escalera en organizaciones de investigación y desarrollo, y titularon su trabajo con una pregunta: <q>¿solución motivacional o ilusión gerencial?</q> <a href="#r-allen">1986</a></p></div>
      <p>Si el especialista gana menos, decide menos o se ve como un premio de consuelo, la gente buena elegirá el mando para subir, y la organización pierde a la vez un buen técnico y gana un jefe por obligación. Por eso el patrón los pone en el mismo escalón y exige criterios para abrir un especialista.</p>
    </div>
    <div class="regla">
      <div class="que"><h3>Un grado que nadie percibe no es un grado</h3><p class="cita">Hay construye su escala sobre la <q>diferencia apenas perceptible</q> entre dos puestos, un paso del 15 %. <a href="#r-hay">Hay, 2014, p. 2</a></p></div>
      <p>Los tres grados de analista solo se usan donde la familia muestra diferencias que se pueden observar en el trabajo: guía, independencia, casos nuevos. Si en una familia el II y el III no se distinguen, se usan dos. Refuerza la <b>premisa 2</b>: no crear tipos de cargo de más.</p>
    </div>
    <div class="regla">
      <div class="que"><h3>Se clasifica por la tarea que más exige</h3><p class="cita">OIT: cuando las tareas requieren competencias de distinto nivel, el empleo se clasifica <q>según las tareas que exigen el mayor nivel de competencias</q>. <a href="#r-oit">CIUO-08, p. 39</a></p></div>
      <p>Un auxiliar que además concilia cuentas cada semana es analista I; uno que lo hace una vez al año sigue siendo auxiliar. La tarea cuenta si es parte estable del cargo. Refuerza la <b>premisa 3</b>: el patrón se aplica al cargo, en la reclasificación, no a partir del censo.</p>
    </div>
  </div>
</section>

<section class="blk" id="decisiones">
  <div class="intro">
    <h2>Decisiones abiertas</h2>
    <p>Tres ya están en las decisiones pendientes de la estructura To-Be: la primera línea, la cabeza país y las denominaciones de la estructura patrón, que abarcan la pareja supervisor o especialista y los grados de analista. Las otras salen de esta descripción. Las que tocan la estructura las toma el liderazgo; las de los escalones, Desarrollo Corporativo con el equipo consultor, en la reclasificación.</p>
  </div>
  <div class="decisiones">
    <div class="dec">
      <h3>Gerencias país bajo una gerencia de unidad de negocio</h3>
      <div class="opc"><span class="epchip">Escalón de gerente de unidad de negocio, apellido país</span><span class="epchip">Escalón de coordinador, apellido país</span><span class="epchip">Escalón de gerente, apellido país</span></div>
      <p class="crit"><b>Criterio:</b> en Ventas y Mercadeo, las gerencias país reportan a una gerencia de unidad de negocio (Retail país a Retail, por ejemplo). En el cruce, su titular no puede quedar en un escalón más alto que el de su jefe, así que no le corresponde el de gerente. Falta decidir si toma el de gerente de unidad de negocio o el de coordinador, según el tamaño de la operación del país.</p>
    </div>
    <div class="dec">
      <h3>Primera línea: Dirección o Vicepresidencia</h3>
      <div class="opc"><span class="epchip">Dirección</span><span class="epchip">Vicepresidencia</span></div>
      <p class="crit"><b>Criterio:</b> «Dirección» se entiende igual en los tres países y es como la estructura nombra hoy esta capa. «Vicepresidencia» separa con claridad el escalón si más adelante hay una dirección general por país, porque evita dos «directores» en niveles distintos. Conviene decidirla junto con la siguiente.</p>
    </div>
    <div class="dec">
      <h3>Cabeza país y tamaño de la gerencia país</h3>
      <div class="opc"><span class="epchip">Sin cabeza país</span><span class="epchip">Dirección general por país</span><span class="epchip">Gerencia país que baja a coordinación</span></div>
      <p class="crit"><b>Criterio:</b> con la regla de Jaques, una cabeza país se justifica si resuelve algo que sus gerentes país no pueden, como integrar entre sí las funciones del país; si solo los reúne, es una capa de más. En el otro sentido, una gerencia país que dirige un área y no tiene coordinaciones debajo trabaja como una coordinación, y así debería quedar escrito.</p>
    </div>
    <div class="dec">
      <h3>Supervisor(a) y Especialista en el mismo escalón</h3>
      <div class="opc"><span class="epchip">Un escalón, dos trayectorias</span><span class="epchip">Dos escalones distintos</span></div>
      <p class="crit"><b>Criterio:</b> la pendiente de la estructura los separa por si se gestiona gente o se valora el conocimiento técnico. Los marcos los ponen al mismo nivel con bandas distintas. Falta confirmar los tres criterios para abrir un especialista y que su retribución sea equivalente.</p>
    </div>
    <div class="dec">
      <h3>Tres grados de analista o dos</h3>
      <div class="opc"><span class="epchip">I · II · III en todas las familias</span><span class="epchip">Según la familia</span><span class="epchip">I · II</span></div>
      <p class="crit"><b>Criterio:</b> un grado se justifica si su diferencia con el vecino se observa en el trabajo. La recomendación es definirlo por familia: tres donde haya casos simples, habituales y complejos claramente distintos, dos donde no.</p>
    </div>
    <div class="dec">
      <h3>Dónde quedan el asesor de tienda y el técnico de servicio</h3>
      <div class="opc"><span class="epchip">Asesor(a) en Auxiliar</span><span class="epchip">Técnico(a) en Operario o Analista I</span></div>
      <p class="crit"><b>Criterio:</b> son dos denominaciones frecuentes en la base de la escalera. La OIT pone a los vendedores de tienda en el nivel 2, el mismo del auxiliar. A los técnicos los ubica según la tarea: reparación en el nivel 2, soporte informático en el 3.</p>
    </div>
  </div>
</section>
