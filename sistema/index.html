<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kenex · el sistema</title>
<meta name="description" content="Prototipo del sistema central de mayoreo y distribución de Grupo Kenex — UCAB Consultores, Fase 2.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo/app.css">
</head>
<body>

<div class="app">

  <!-- ═══════════════════════════════════════════════════ chrome superior -->
  <header class="chrome">
    <button class="btn btn-fantasma btn-mini abre-menu" id="abre-menu" aria-label="Menú">☰</button>

    <div class="logo">
      <span class="orbe orbe-grande actuando" aria-hidden="true"></span>
      <div>
        <div class="nom">kenex</div>
        <div class="sub">el sistema</div>
      </div>
    </div>

    <div class="marquee" id="marquee" aria-live="polite"></div>

    <button class="btn btn-fantasma btn-mini" id="probar-estela" title="Ver cómo una acción cruza los módulos">
      ⇢ estela
    </button>

    <button class="btn btn-suave btn-mini" id="abre-recorrido" title="Recorrido guiado de punta a punta">
      ▶ recorrido
    </button>

    <div class="selector-rol">
      <span class="sobretitulo" style="letter-spacing:.12em">rol</span>
      <select id="rol" aria-label="Rol activo"></select>
    </div>

    <button class="btn btn-suave btn-mini" id="tema" aria-label="Cambiar tema">☾</button>
  </header>

  <!-- ══════════════ banda del freno · fuera del lienzo a propósito:
       ninguna pantalla puede repintarse y hacerla desaparecer -->
  <div class="banda-freno" id="banda-freno" role="status" hidden></div>

  <!-- ═══════════════════════════════════════════════════════════ menú -->
  <nav class="menu" id="menu" aria-label="Módulos"></nav>

  <!-- ═══════════════════════════════════════════════════════════ lienzo -->
  <main class="lienzo" id="lienzo"></main>

</div>

<!-- ═══════════════════════════════════════ portada (fase 26): la puerta.
     Solo aparece al llegar SIN hash — un enlace profundo entra directo — y
     cualquier navegación la cierra. Entrar = arrancar el recorrido guiado. -->
<div class="portada" id="portada">
  <div class="portada-caja">
    <div class="portada-marca">
      <span class="orbe orbe-grande actuando" aria-hidden="true"></span>
      <div class="portada-nom">kenex</div>
      <div class="portada-sub">el sistema</div>
    </div>
    <p class="portada-tesis">La compra, el inventario y la venta del grupo en un solo lugar.
      <b>La IA propone; una persona firma; todo deja rastro.</b></p>
    <div class="portada-acciones">
      <button class="btn btn-marca portada-entrar" id="entrar">Entrar</button>
      <!-- la cifra de paradas la pone el JS desde RECORRIDO: nada escrito a mano -->
      <div class="portada-nota" id="portada-nota"></div>
      <a class="portada-directo" id="entrar-directo" href="javascript:void(0)">entrar directo, sin recorrido →</a>
    </div>
    <div class="portada-pie">Prototipo de propuesta · UCAB Consultores para Grupo Kenex · los datos son de demostración</div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════ HUD del agente -->
<div class="hud" id="hud" role="button" tabindex="0" title="Ir a la sala de agentes"></div>

<!-- ═══════════════════════════════════════ barra del recorrido (fase 21) -->
<div class="recorrido" id="recorrido" hidden></div>

<!-- datos semilla (fase 4) -->
<script src="datos/catalogo.js"></script>
<script src="datos/red.js"></script>
<script src="datos/operacion.js"></script>
<script src="datos/candidatos.js"></script>
<script src="datos/proveedores.js"></script>
<script src="datos/reportes.js"></script>

<!-- núcleo de agentes (fase 5): lógica determinista sobre los datos semilla -->
  <script src="datos/tasas.js"></script>
  <script src="nucleo/agentes.js"></script>

<!-- pantallas de los módulos; cada fase añade la suya -->
<script src="pantallas/cimiento.js"></script>
<script src="pantallas/compras.js"></script>
<script src="pantallas/mesa-casio.js"></script>
<script src="pantallas/cierre.js"></script>
<script src="pantallas/mesa-cubitt.js"></script>
<script src="pantallas/producto.js"></script>
<script src="pantallas/fabricas.js"></script>
<script src="pantallas/transitos.js"></script>
<script src="pantallas/distribucion.js"></script>
<script src="pantallas/logistica.js"></script>
<script src="pantallas/inventario.js"></script>
<script src="pantallas/comercial.js"></script>
<script src="pantallas/demanda.js"></script>
<script src="pantallas/portal.js"></script>
<script src="pantallas/conectores.js"></script>
<script src="pantallas/direccion.js"></script>
  <script src="pantallas/agentes.js"></script>

<script src="nucleo/recorrido.js"></script>
<script src="nucleo/app.js"></script>
</body>
</html>
